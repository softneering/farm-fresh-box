// ---- Profit calculator ----
const inr = x => (x < 0 ? "-" : "") + "₹" + Math.abs(Math.round(x)).toLocaleString("en-IN");

function Calc() {
  const [v, setV] = useState({ apmc: 100, app: 200, sell: 150, kg: 7, orders: 40, del: 1, waste: 10, veh: 3000, lab: 2000, per: 25, fee: CFG.fee, share: 50 });
  const [real, setReal] = useState(null);
  const n = k => +v[k] || 0;
  // Fill kg, price, orders per delivery and fee share from the orders saved on this device (last 4 weeks)
  const useReal = () => {
    const since = Date.now() - 28 * 864e5;
    const os = allRawOrders().filter(o => (o.t || 0) >= since && +o.kg > 0 && +o.sub > 0);
    if (!os.length) { setReal({ n: 0 }); return; }
    const kg = os.reduce((t, o) => t + +o.kg, 0), sub = os.reduce((t, o) => t + +o.sub, 0), paid = os.filter(o => +o.fee > 0).length;
    const per = os.length / 4 / Math.max(1, n("del"));
    const upd = { kg: Math.round(kg / os.length * 10) / 10, sell: Math.round(sub / kg), orders: Math.max(1, Math.round(per)), share: Math.round(paid / os.length * 100) };
    setV({ ...v, ...upd });
    setReal({ n: os.length, basket: Math.round(sub / os.length), ...upd });
  };
  const calc = o => {
    const sold = o * n("kg"), bought = sold * (1 + n("waste") / 100);
    const rev = sold * n("sell") + o * n("share") / 100 * n("fee");
    return { rev, profit: rev - bought * n("apmc") - n("veh") - n("lab") - o * n("per") };
  };
  const r = calc(n("orders"));
  const weekly = r.profit * n("del"), monthly = weekly * 4.3;
  const margin = r.rev > 0 ? r.profit / r.rev * 100 : 0;
  const contrib = n("kg") * (n("sell") - n("apmc") * (1 + n("waste") / 100)) - n("per") + n("share") / 100 * n("fee");
  const be = contrib > 0 ? Math.ceil((n("veh") + n("lab")) / contrib) : null;
  const basket = n("kg") * n("sell");
  const below = n("app") > 0 ? (n("app") - n("sell")) / n("app") * 100 : 0;
  let vd, cls = "good";
  if (r.profit <= 0) { vd = "Loss-making at these numbers."; cls = "bad"; }
  else if (margin < 8) { vd = "Marginal. There is very little room for mistakes."; cls = "bad"; }
  else if (margin < 15) { vd = "Workable. Test it with a small pilot first."; }
  else { vd = "Looks worthwhile if demand and prices hold."; }
  const fld = (k, label) => h`<label>${label}<input type="number" inputmode="decimal" min="0" value=${v[k]} onInput=${e => setV({ ...v, [k]: e.target.value })} /></label>`;
  return h`<div class="wrap adm">
    <header><h1>Profit calculator</h1><p class="sub">Enter your real prices and costs. All figures are per delivery unless noted.</p></header>
    <div class="oc" style=${{ margin: "0 0 12px" }}>
      <button class="ghost" onClick=${useReal}>Use my real orders</button>
      ${real === null && h`<p class="note" style=${{ margin: "6px 0 0" }}>Fills average kg, selling price, orders per delivery and fee share from orders saved on this device in the last 4 weeks.</p>`}
      ${real && real.n === 0 && h`<p class="note warn" style=${{ margin: "6px 0 0" }}>No recent orders with a recorded weight on this device yet, so nothing was changed. Orders placed before weights were recorded are skipped.</p>`}
      ${real && real.n > 0 && h`<p class="note good" role="status" style=${{ margin: "6px 0 0" }}>Filled from ${real.n} order${real.n === 1 ? "" : "s"}: average basket ₹${real.basket}, ${real.kg} kg per order, ₹${real.sell}/kg blended selling price, about ${real.orders} orders per delivery (${n("del")} deliver${n("del") === 1 ? "y" : "ies"} a week), ${real.share}% paying the delivery fee.${real.n < 10 ? " This is a small sample, so treat it as rough." : ""} APMC price, wastage and trip costs are still your own numbers.</p>`}
    </div>
    <div class="fg">
      ${fld("apmc", "APMC price you pay (₹/kg)")}
      ${fld("app", "App or market price (₹/kg)")}
      ${fld("sell", "Your selling price (₹/kg)")}
      ${fld("kg", "Average kg per order")}
      ${fld("orders", "Orders per delivery")}
      ${fld("del", "Deliveries per week")}
      ${fld("waste", "Extra bought for wastage (%)")}
      ${fld("veh", "Vehicle, fuel and tolls per trip (₹)")}
      ${fld("lab", "Helper or labour per trip (₹)")}
      ${fld("per", "Packing and payment per order (₹)")}
      ${fld("fee", "Delivery fee you charge (₹)")}
      ${fld("share", "Orders paying the fee (%)")}
    </div>
    <div class="sm sm2">
      <div><b class=${cls}>${inr(weekly)}</b><span>profit per week</span></div>
      <div><b class=${cls}>${inr(monthly)}</b><span>profit per month</span></div>
      <div><b>${margin.toFixed(1)}%</b><span>net margin</span></div>
      <div><b>${be === null ? "Never" : be}</b><span>orders to break even per trip</span></div>
    </div>
    <p class=${"vd " + cls}>${vd}</p>
    ${be !== null && n("orders") < be && h`<p class="warn">You need at least ${be} orders per delivery to cover the trip.</p>`}
    <p class="note">Average basket: ${inr(basket)}. Minimum order ${inr(CFG.min)}; delivery is free above ${inr(CFG.freeAbove)}, otherwise ${inr(CFG.fee)}. "Orders paying the fee" is the share of orders below the free-delivery limit.</p>
    ${basket < CFG.min && h`<p class="warn">Your average basket is below the ${inr(CFG.min)} minimum order. Check the kg per order and your selling price.</p>`}
    <p class="note">Your price is ${below.toFixed(0)}% ${below >= 0 ? "below" : "above"} the app price. Gross gap between app and APMC: ${inr(n("app") - n("apmc"))}/kg.</p>
    <h2>Weekly profit at different volumes</h2>
    <ul>${[10, 20, 30, 40, 60].map(o => h`<li key=${o} class="sens"><span>${o} orders per delivery</span><b class=${calc(o).profit >= 0 ? "good" : "bad"}>${inr(calc(o).profit * n("del"))}</b></li>`)}</ul>
    <p class="note" style=${{ marginTop: 12 }}>Does not include your own time, FSSAI and registration costs, returns, refunds or any society fees. Check the app price on several items before trusting the gap.</p>
  </div>`;
}

// ---- Price check: APMC vs local seller vs app ----
function PriceCheck() {
  const init = () => {
    try { const o = JSON.parse(localStorage.getItem("wfb_prices") || "null"); if (o && o.p) return o; } catch (e) {}
    return { p: {}, waste: 10, cut: 15 };
  };
  const [st, setSt] = useState(init);
  React.useEffect(() => { try { localStorage.setItem("wfb_prices", JSON.stringify(st)); } catch (e) {} }, [st]);
  const num = x => +x || 0;
  const setP = (id, k, v) => setSt({ ...st, p: { ...st.p, [id]: { ...(st.p[id] || {}), [k]: v } } });
  const rows = ITEMS.map(i => {
    const r = st.p[i.id] || {};
    const a = num(r.apmc), l = num(r.local), p = num(r.app);
    const alts = [l, p].filter(x => x > 0);
    if (!(a > 0 && alts.length)) return { i, r, done: false };
    const sell = Math.round(Math.min(...alts) * (1 - num(st.cut) / 100));
    const margin = (sell - a * (1 + num(st.waste) / 100)) / sell * 100;
    return { i, r, done: true, sell, margin, gap: p > 0 ? (p - a) / p * 100 : null };
  });
  const done = rows.filter(x => x.done);
  const gaps = done.filter(x => x.gap !== null);
  const avg = arr => arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : 0;
  const avgGap = avg(gaps.map(x => x.gap)), avgMargin = avg(done.map(x => x.margin));
  const good = done.filter(x => x.margin >= 15).length, ok = done.filter(x => x.margin >= 8 && x.margin < 15).length;
  let vd = "", cls = "good";
  if (done.length < 5) { vd = "Enter prices for at least 5 items to get a useful read."; cls = ""; }
  else if (good / done.length >= 0.5) vd = "Strong: most items leave a healthy margin after wastage.";
  else if ((good + ok) / done.length >= 0.5) { vd = "Mixed: only some items are worth selling. Focus on the green ones."; cls = "mid"; }
  else { vd = "Weak: the price gap is too small on most items to cover wastage and costs."; cls = "bad"; }
  const reset = () => setSt({ p: {}, waste: st.waste, cut: st.cut });
  const setG = k => e => setSt({ ...st, [k]: e.target.value });
  return h`<div class="wrap adm">
    <header><h1>Price check</h1><p class="sub">Enter prices per unit as shown. Leave blank what you did not check. Your entries are saved on this device.</p></header>
    <div class="fg">
      <label>Extra bought for wastage (%)<input type="number" inputmode="decimal" min="0" value=${st.waste} onInput=${setG("waste")} /></label>
      <label>Sell below the cheapest rival by (%)<input type="number" inputmode="decimal" min="0" value=${st.cut} onInput=${setG("cut")} /></label>
    </div>
    <div class="sm sm2">
      <div><b>${done.length}</b><span>items checked</span></div>
      <div><b>${gaps.length ? avgGap.toFixed(0) + "%" : "–"}</b><span>average APMC gap vs app</span></div>
      <div><b>${done.length ? avgMargin.toFixed(0) + "%" : "–"}</b><span>average margin after wastage</span></div>
      <div><b>${good}</b><span>items with 15%+ margin</span></div>
    </div>
    <p class=${"vd " + cls}>${vd}</p>
    <div class="pch"><span>Item</span><span>APMC ₹</span><span>Local ₹</span><span>App ₹</span></div>
    <ul>${rows.map(x => h`<li key=${x.i.id} class="pc">
      <div class="t">
        <div><b>${x.i.e} ${x.i.n}</b><div class="note" style=${{ margin: 0 }}>per ${x.i.u}</div></div>
        <input type="number" inputmode="decimal" min="0" aria-label=${x.i.n + " APMC price"} value=${x.r.apmc || ""} onInput=${e => setP(x.i.id, "apmc", e.target.value)} />
        <input type="number" inputmode="decimal" min="0" aria-label=${x.i.n + " local seller price"} value=${x.r.local || ""} onInput=${e => setP(x.i.id, "local", e.target.value)} />
        <input type="number" inputmode="decimal" min="0" aria-label=${x.i.n + " app price"} value=${x.r.app || ""} onInput=${e => setP(x.i.id, "app", e.target.value)} />
      </div>
      ${x.done && h`<div class=${"r " + (x.margin >= 15 ? "good" : x.margin >= 8 ? "mid" : "bad")}>Sell at ${inr(x.sell)} · margin ${x.margin.toFixed(0)}%${x.margin >= 15 ? " · worth selling" : x.margin >= 8 ? " · thin" : " · skip or raise price"}</div>`}
    </li>`)}</ul>
    <p class="note" style=${{ marginTop: 12 }}>Suggested sell price = the cheaper of the local seller and the app, minus your discount. Margin is after your wastage allowance and does not include delivery, packing or labour. Check the same quality and the same pack size on each platform.</p>
    <button class="lk" onClick=${reset}>Clear all prices</button>
  </div>`;
}

// ---- Catalogue editor ----
const normItem = x => ({ id: x.id, c: +x.c, e: x.e || "🛒", n: x.n, u: x.u || "kg", p: +x.p || 0, mrp: +x.mrp || 0, ...(+x.w > 0 ? { w: +x.w } : {}), ...(+x.cost > 0 ? { cost: +x.cost } : {}), ...(GST_RATES.includes(+x.g) && +x.g > 0 ? { g: +x.g } : {}), ...(String(x.hsn || "").trim() ? { hsn: String(x.hsn).trim().replace(/\D/g, "").slice(0, 8) } : {}) });

function Catalogue() {

const fmtDT = t => { const d = new Date(t); return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" }); };
const empName = m => m === "admin" ? "Admin" : m === "auto" ? "the system" : m === "customer" ? "the customer" : (loadEmps().find(e => e.mobile === m) || {}).name || m || "nobody";
// One readable line for an event in an order's trail
function trailLine(a) {
  const by = a.by ? " (by " + empName(a.by) + ")" : "";
  switch (a.type) {
    case "placed": return "Order placed";
    case "assigned":
      if (a.claimed) return empName(a.emp) + " took this order from the unassigned list";
      if (a.by === "auto") return (a.emp ? "Assigned to " + empName(a.emp) : "Left unassigned") + (a.from ? " (was " + empName(a.from) + ")" : "") + " automatically";
      return (a.emp ? "Assigned to " + empName(a.emp) : "Set to not assigned") + (a.from ? " (was " + empName(a.from) + ")" : "") + by;
    case "status": return "Marked " + ((STAGES.find(x => x[0] === a.status) || [0, a.status])[1]) + by;
    case "wrong_code": return "Wrong code entered by " + empName(a.emp);
    case "locked": return "Locked after too many wrong codes (" + empName(a.emp) + ")";
    case "taken_over": return "Delivered by " + empName(a.emp) + " instead of " + empName(a.from);
    case "delivered": return a.codeOk === false ? "Marked delivered by admin without a code" : "Delivered by " + empName(a.emp) + ", code verified";
    default: return a.type;
  }
}
const orderEvents = id => lsGet(AUK, []).filter(a => a.order === id).sort((x, y) => x.t - y.t);
function OrderTrail({ id }) {
  const [on, setOn] = useState(false);
  const ev = on ? orderEvents(id) : [];
  return h`<details class="sd" onToggle=${e => setOn(e.target.open)}><summary>History</summary>
    ${on && (ev.length === 0 ? h`<p class="note">No history was recorded for this order on this device.</p>` : h`<ol class="trail">${ev.map((a, i) => h`<li key=${i}><span>${fmtDT(a.t)}</span>${trailLine(a)}</li>`)}</ol>`)}
  </details>`;
}
const AUD_TXT = { placed: "Order placed", assigned: "Order assigned", taken_over: "Delivered by someone other than the assignee", wrong_code: "Wrong delivery code", locked: "Order locked after too many wrong codes", delivered: "Delivered", status: "Order status changed", settings: "Settings changed", employee_added: "Employee added", pages_changed: "Employee pages changed", employee_activated: "Employee activated", employee_deactivated: "Employee deactivated", paid: "Payment released" };

function Payouts({ emps, raw, save, bump, part }) {
  const [range, setRange] = useState("week");

  const [conf, setConf] = useState("");

  const [pv, setPv] = useState("due"), [pq, setPq] = useState(""), [plim, setPlim] = useState(8);
  const now = new Date();
  const start = range === "all" ? 0 : range === "month" ? new Date(now.getFullYear(), now.getMonth(), 1).getTime()
    : range === "today" ? new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime()

  });
  const setRate = (e, v) => save(emps.map(x => x.mobile === e.mobile ? { ...x, rate: Math.max(0, +v || 0) } : x));

    const t = Date.now(), ids = r.un.map(o => o.id);

  const copy = () => { try { navigator.clipboard.writeText(csvText()).then(() => setCopied(true)); } catch (e) { setCopied(false); } };
  const allLog = lsGet(AUK, []);

  const flagList = o => { const f = flagsFor[o] || {}; return [f.re >= 2 && "Reassigned " + f.re + "×", f.wr >= 3 && f.wr + " wrong codes", f.to && "Not the assignee"].filter(Boolean); };
  const lq = lg.q.trim().toLowerCase();
  const logAll = allLog.filter(a => (!who || a.emp === who) && (!lg.t || (lg.t === "flag" ? a.order != null && flagList(a.order).length > 0 : a.type === lg.t))

  const log = logAll.slice(0, lg.n);

  };

// Tick-list of societies for an employee. value = array of society names; empty means every society.
function SocPicker({ value, onChange }) {
  const [q, setQ] = useState("");
  const val = value || [];
  const norm = v => String(v).toLowerCase().trim();
  const low = SOCIETIES.map(x => x.name.toLowerCase());
  const gone = val.filter(v => !low.includes(norm(v)));
  const has = n => val.some(v => norm(v) === n.toLowerCase());
  const toggle = n => onChange(has(n) ? val.filter(v => norm(v) !== n.toLowerCase()) : [...val, n]);
  const t = q.trim().toLowerCase();
  const shown = SOCIETIES.filter(x => !t || [x.name, x.area, x.pincode].some(f => String(f || "").toLowerCase().includes(t))).map(x => x.name);
  const shownGone = gone.filter(n => !t || n.toLowerCase().includes(t));
  const cnt = val.length;
  return h`<div class="spk">
    <div class="top"><b>Societies they cover</b><span class="note" style=${{ margin: 0 }}>${cnt === 0 ? "All societies" : cnt + " selected"}</span></div>
    ${SOCIETIES.length === 0 && h`<p class="note">Add societies in the Societies tab first. Until then this employee covers everyone.</p>`}
    ${SOCIETIES.length > 0 && h`<input type="search" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search societies" aria-label="Search societies" />`}
    <div class="pgs">${shown.map(n => h`<label key=${n} class="pk2"><input type="checkbox" checked=${has(n)} onChange=${() => toggle(n)} /><span><b>${n}</b></span></label>`)}
      ${shownGone.map(n => h`<label key=${"x" + n} class="pk2"><input type="checkbox" checked=${true} onChange=${() => onChange(val.filter(v => v !== n))} /><span><b>${n}</b><small>(removed) not in your societies list. Untick to drop it.</small></span></label>`)}
      ${t && shown.length === 0 && shownGone.length === 0 && h`<p class="note">No society matches "${q.trim()}".</p>`}</div>
    ${SOCIETIES.length > 0 && h`<div style=${{ display: "flex", gap: 8, margin: "6px 0" }}>
      <button type="button" class="lk" onClick=${() => onChange([...new Set([...val, ...shown])])}>${t ? "Select shown" : "Select all"}</button>
      <button type="button" class="lk" onClick=${() => onChange(t ? val.filter(v => !shown.some(n => n.toLowerCase() === norm(v)) && !shownGone.includes(v)) : [])}>${t ? "Clear shown" : "Clear"}</button></div>`}
    <p class="note" style=${{ margin: 0 }}>Leave all unticked to let this employee get orders from any society.</p>
  </div>`;
}

    ${bad && h`<p class="warn">Enter amounts of 0 or more (fee and pay up to ₹5,000), attempts from 1 to 50, and fill both lines.</p>`}
    ${!bad && gv > 0 && gv <= m && h`<p class="warn">Free delivery starts at or below the minimum order, so delivery will always be free.</p>`}
    ${!bad && gv === 0 && h`<p class="warn">Free delivery from ₹0 means delivery is always free.</p>`}
    ${hasOwn && h`<div class="oc" style=${{ margin: "4px 0 12px" }}>
      <p style=${{ margin: "0 0 6px" }}><b>Some societies have their own settings</b></p>
      <p class="note" style=${{ margin: "0 0 8px" }}>${[...ownDay.map(x => x.name + ": delivery " + x.day), ...ownMin.map(x => x.name + ": minimum ₹" + x.min)].join(" · ")}. Those override the values above for that society.</p>
      <label class="pk2" style=${{ margin: 0 }}><input type="checkbox" checked=${allSoc} onChange=${e => setAllSoc(e.target.checked)} /><span><b>Use these values for every society</b><small>Removes each society's own delivery slot and minimum.</small></span></label>
    </div>`}
    <p class="note">What customers will see:</p>
    <div class="banner"><span>🕘</span><span>Orders placed by <b>${close || "…"}</b>. Delivery <b>${delivery || "…"}</b>. Minimum order <b>₹${bad ? "…" : m}</b>.</span></div>
    ${!bad && h`<p class="note">In the cart: delivery is <b>₹${fv}</b> for orders below ₹${gv}, and <b>free</b> for orders of ₹${gv} or more.</p>`}
    </div>`}
    ${st === "home" && h`<div>
    <h2 style=${{ margin: "4px 0 4px" }}>Tag line</h2>
    <label>Shown under the app name on the login and Home pages<input maxLength="80" value=${tag} onInput=${e => { setTag(e.target.value); setMsg(""); }} placeholder=${DEFAULT_TAGLINE} /></label>
    <p class="note">Leave it empty to hide the tag line. ${tag.trim() && h`Preview: <b>${tag.trim()}</b>`}</p>
    <h2 style=${{ margin: "14px 0 4px" }}>Home banners</h2>
    <p class="note">Short messages customers swipe through at the top of Home. You can use these placeholders and they fill in automatically: <b>{savePct}</b> saving vs local prices, <b>{local1000}</b> what a ₹1,000 basket costs locally, <b>{min}</b>, <b>{free}</b>, <b>{fee}</b>, <b>{close}</b>, <b>{delivery}</b>.</p>
    ${bn.map((b, k) => h`<div key=${k} class="oc" style=${{ margin: "0 0 8px" }}>
      <label class="pk2" style=${{ margin: 0 }}><input type="checkbox" checked=${b.on} onChange=${e => setB(k, { on: e.target.checked })} /><span><b>Banner ${k + 1}</b><small>${b.on ? "Shown to customers" : "Hidden"}</small></span></label>
      <label>Headline<input maxLength="80" value=${b.title} onInput=${e => setB(k, { title: e.target.value })} /></label>
      <label>Supporting line<input maxLength="200" value=${b.text} onInput=${e => setB(k, { text: e.target.value })} /></label>
      <button class="lk" onClick=${() => { setBn(bn.filter((_, j) => j !== k)); setMsg(""); }}>Remove</button>
    </div>`)}
    ${bn.length < 8 && h`<button class="ghost" onClick=${() => { setBn([...bn, { on: true, title: "", text: "" }]); setMsg(""); }}>+ Add a banner</button>`}
    ${bn.some(b => b.on && b.title.trim()) && h`<p class="note">Preview:</p><${Carousel} items=${bn} auto=${false} />`}
    <h2 style=${{ margin: "14px 0 4px" }}>Categories</h2>
    <p class="note">Tick the categories customers can see. Unticked ones disappear from Home, Category, search, deals and the family box. Items stay in your catalogue.</p>
    <div class="pgs">${CATS.map((c, i) => h`<label key=${c} class="pk2"><input type="checkbox" checked=${!off.includes(i)} onChange=${e => { setOff(e.target.checked ? off.filter(x => x !== i) : [...off, i]); setMsg(""); }} /><span><b>${CAT_E[i] || "🛒"} ${c}</b><small>${ITEMS.filter(x => +x.c === i).length} items · ${off.includes(i) ? "Hidden from customers" : "Shown to customers"}</small></span></label>`)}</div>
    ${off.length >= CATS.length && h`<p class="warn">At least one category must stay on.</p>`}
    </div>`}
    ${st === "groups" && h`<div>
    <h2 style=${{ margin: "4px 0 4px" }}>Group ordering</h2>
    <label class="pk2"><input type="checkbox" checked=${gpOn} onChange=${e => { setGpOn(e.target.checked); setMsg(""); }} /><span><b>Let customers order in groups</b><small>Neighbours join a group by link, each places their own order, and the delivery fee is shared. Turning this off hides groups from customers; existing groups are kept.</small></span></label>
    ${gpOn && h`<label>Minimum order for each member in a group (₹)<input type="number" inputMode="numeric" min="0" value=${gpMin} onChange=${e => { setGpMin(e.target.value); setMsg(""); }} onInput=${e => { setGpMin(e.target.value); setMsg(""); }} /></label>`}
    ${gpOn && h`<p class="note">Group members can order less than the normal minimum (₹${CFG.min}). Delivery is free for everyone once the group's total reaches ₹${CFG.freeAbove}.</p>`}
    </div>`}
    ${st === "gst" && h`<div>
    <h2 style=${{ margin: "4px 0 4px" }}>GST</h2>
    <label class="pk2"><input type="checkbox" checked=${gOn} onChange=${e => { setGOn(e.target.checked); setMsg(""); }} /><span><b>Charge GST on bills</b><small>Keep this off until your CA confirms you are registered and which rates apply. Set each item's GST % and HSN in Catalogue.</small></span></label>
    ${gOn && h`<div>
      <label>Your GSTIN<input maxLength="15" value=${gin} onInput=${e => { setGin(e.target.value.toUpperCase()); setMsg(""); }} placeholder="27ABCDE1234F1Z5" /></label>
      ${gin.trim() !== "" && bad && !/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(gin.trim()) && h`<p class="warn">A GSTIN has 15 characters, like 27ABCDE1234F1Z5.</p>`}
      <label class="pk2"><input type="checkbox" checked=${gIncl} onChange=${e => { setGIncl(e.target.checked); setMsg(""); }} /><span><b>Prices already include GST</b><small>${gIncl ? "Customers pay the listed price. The bill shows how much GST is inside it." : "GST is added on top of the listed price at checkout."}</small></span></label>
      <label>GST on delivery fee<select value=${gFee} onChange=${e => { setGFee(e.target.value); setMsg(""); }}>${rates.map(r => h`<option key=${r} value=${r}>${r}%</option>`)}</select></label>
      <p class="note">Delivery fee GST depends on your CA's advice. Without a GSTIN, the customer bill is called "Bill", not "Tax invoice".</p>
    </div>`}
    <h2 style=${{ margin: "14px 0 4px" }}>GST rate list</h2>
    <p class="note">The rates you can pick for items in Catalogue and for the delivery fee. Add a rate, or remove one that no item uses. 0% always stays.</p>
    <div class="chips">${rates.map(r => h`<span key=${r} class="chip" style=${{ display: "inline-flex", alignItems: "center", gap: 6 }}>${r}%${r !== 0 && usedBy(r) === 0 && +gFee !== r ? h`<button class="lk" aria-label=${"Remove " + r + "%"} onClick=${() => dropRate(r)}>×</button>` : r !== 0 ? h`<small>${usedBy(r)} item${usedBy(r) === 1 ? "" : "s"}</small>` : ""}</span>`)}</div>
    <div style=${{ display: "flex", gap: 8, margin: "8px 0" }}><input type="number" inputMode="decimal" min="0" max="100" step="0.1" placeholder="e.g. 28" aria-label="New GST rate" value=${nr} onInput=${e => setNr(e.target.value)} /><button class="ghost" onClick=${addRate}>Add rate</button></div>
    </div>`}
    <div class="savebar">
      ${bad && h`<p class="warn" style=${{ margin: "0 0 6px" }}>Some values need fixing (check the tabs). Amounts must be 0 or more, attempts 1 to 50, and a GSTIN must have 15 characters.</p>`}
      <div style=${{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <button class="cta" disabled=${bad} onClick=${save}>Save</button>
        <button class="ghost" onClick=${reset}>Reset to defaults</button>
        ${msg && h`<span class="note good" role="status" style=${{ margin: 0 }}>${msg}</span>`}
      </div>
    </div>
    <p class="note" style=${{ marginTop: 12 }}>A society can have its own delivery slot and minimum when you add it in the Societies tab. If it does not, these apply. Saved in this browser for now, so other phones will pick it up once the backend is connected.</p>
  </div>`;
}

function Shell() {
  const [t, setT] = useState(0);
  return h`<div>
    <div class="wrap"><div class="tabs top" role="group" aria-label="Admin sections">
      <button class="tab" aria-pressed=${t === 0} onClick=${() => setT(0)}>Stock and orders</button>
      <button class="tab" aria-pressed=${t === 1} onClick=${() => setT(1)}>Profit calculator</button>
      <button class="tab" aria-pressed=${t === 2} onClick=${() => setT(2)}>Price check</button>
      <button class="tab" aria-pressed=${t === 3} onClick=${() => setT(3)}>Catalogue</button>
      <button class="tab" aria-pressed=${t === 4} onClick=${() => setT(4)}>Societies</button>
      <button class="tab" aria-pressed=${t === 5} onClick=${() => setT(5)}>Team</button>
      <button class="tab" aria-pressed=${t === 6} onClick=${() => setT(6)}>Insights</button>
      <button class="tab" aria-pressed=${t === 7} onClick=${() => setT(7)}>Settings</button>
    </div></div>
    ${t === 0 ? h`<${Admin} />` : t === 1 ? h`<${Calc} />` : t === 2 ? h`<${PriceCheck} />` : t === 3 ? h`<${Catalogue} />` : t === 4 ? h`<${SocietiesAdmin} />` : t === 5 ? h`<${TeamAdmin} />` : t === 6 ? h`<${Insights} />` : h`<${SettingsAdmin} />`}
  </div>`;
}

function AdminGate() {
  const [m, setM] = useState(loadSession());
  const out = () => { clearSession(); setM(""); };
  if (!m) return h`<${Login} onDone=${setM} />`;
  if (!ADMIN_MOBILES.includes(m)) return h`<div class="wrap lg">
    <h1>Admin access only</h1>
    <p class="sub">+91 ${m} does not have admin access.</p>
    <p><a class="lk" href="#">Back to the order page</a> · <button class="lk" onClick=${out}>Log out and use another number</button></p>
  </div>`;
  return h`<div>
    <${Shell} />
    <div class="wrap"><p class="note" style=${{ marginTop: 20 }}>Admin: +91 ${m} · <button class="lk" onClick=${out}>Log out</button></p></div>
  </div>`;
}

function Root() {
  const [hs, setHs] = useState(location.hash);
  React.useEffect(() => {
    const f = () => setHs(location.hash);
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);
  const join = /^#g-/i.test(hs) ? hs.slice(3).toUpperCase() : "";
  const link = hs && hs !== "#admin" && !join ? SOCIETIES.find(x => x.id === hs.slice(1)) || null : null;
  return hs === "#admin" ? h`<${AdminGate} />` : h`<${Gate} link=${link} join=${join} />`;
}

migrateOrders();
loadPhotos();
ReactDOM.createRoot(document.getElementById("root")).render(h`<${Root} />`);
</script>
</body>
</html>
