<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Fresh Box – Weekly pre-order</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6f0;--card:#fff;--ink:#17261c;--mut:#5a6b5f;--line:#dbe5d8;--leaf:#1f7a4d;--cta:#e8472b;--oncta:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a13;--card:#17261c;--ink:#eaf3ec;--mut:#9db3a3;--line:#27382d;--leaf:#5fd08f;--cta:#ff6b4a;--oncta:#1a0d09}}
:root[data-theme="dark"]{--bg:#0f1a13;--card:#17261c;--ink:#eaf3ec;--mut:#9db3a3;--line:#27382d;--leaf:#5fd08f;--cta:#ff6b4a;--oncta:#1a0d09}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;padding-bottom:210px}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cta);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:22px 0 14px}
h1{font-size:34px;font-weight:800;color:var(--leaf)}
.sub{color:var(--mut);margin:6px 0 0}
.banner{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0;font-size:15px}
.banner b{color:var(--cta)}
.note{font-size:13px;color:var(--mut);margin:0 0 12px}
.tabs{display:flex;gap:8px;margin:14px 0;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:700;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.box{background:var(--leaf);color:var(--bg);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.box h2{font-size:20px}
.box p{margin:4px 0 0;font-size:14px;opacity:.9}
.box button{background:var(--bg);color:var(--leaf);border:0;border-radius:999px;padding:10px 16px;font-weight:700;white-space:nowrap}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.em{font-size:30px;width:48px;height:48px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.nm{flex:1;min-width:0}
.nm b{display:block}
.nm span{color:var(--mut);font-size:14px}
.add{border:2px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:999px;padding:7px 18px;font-weight:700}
.step{display:flex;align-items:center;gap:4px;background:var(--leaf);color:var(--bg);border-radius:999px}
.step button{width:36px;height:36px;border:0;background:transparent;color:inherit;font-size:20px;font-weight:700}
.step span{min-width:22px;text-align:center;font-weight:700}
.bar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar b{font-size:18px}
.cta{background:var(--cta);color:var(--oncta);border:0;border-radius:999px;padding:13px 22px;font-weight:700}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h2{font-size:24px}
.x{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:22px}
.nudge{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--leaf);color:var(--bg)}
.nudge.need{background:var(--cta);color:var(--oncta)}
.nudge.ok{background:var(--card);color:var(--leaf);border:1px solid var(--leaf)}
.nudge .nt{display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.3}
.nudge .nt b{font-size:18px}
.nudge .ni{font-size:24px;flex:none}
.nudge .np{height:8px;border-radius:8px;background:rgba(255,255,255,.35);margin-top:10px;overflow:hidden}
.nudge .np i{display:block;height:100%;border-radius:8px;background:currentColor;transition:width .3s}
.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0;display:grid;gap:6px}
.sum div{display:flex;justify-content:space-between}
.sum .t{font-weight:700;font-size:18px;border-top:1px solid var(--line);padding-top:8px}
label{display:grid;gap:5px;font-weight:700;font-size:14px;margin-bottom:10px}
input,textarea{font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.warn{color:var(--cta);font-size:14px;margin:0 0 10px}
.adm h1{font-size:30px}
.adm textarea{width:100%;min-height:150px;margin:8px 0 12px}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.sm div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.sm b{display:block;font-size:20px;font-family:"Bricolage Grotesque",sans-serif}
.sm span{font-size:12px;color:var(--mut)}
.br{display:grid;grid-template-columns:1fr auto 84px;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.br input{padding:8px;width:84px}
.pk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pk p{margin:2px 0;color:var(--mut);font-size:14px}
.adm h2{font-size:20px;margin:22px 0 10px}
.adm a{color:var(--leaf);font-weight:700}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg>label{min-width:0}.fg input{min-width:0;width:100%;box-sizing:border-box}
@media (max-width:340px){.fg{grid-template-columns:1fr}}
.sm2{grid-template-columns:1fr 1fr}
.vd{font-weight:700;font-size:19px;margin:14px 0 4px}
.good{color:var(--leaf)}.bad{color:var(--cta)}
.sens{display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.tabs.top{padding-top:16px}
.sr{display:grid;grid-template-columns:1fr auto 64px;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.sr span:last-child{text-align:right}
.sr small{color:var(--mut)}
.sr.tot{border-bottom:0;font-weight:700;font-size:17px}
.sd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sd summary{cursor:pointer;font-weight:700}
.sd[open] summary{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chp{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font-weight:700}
.chp[aria-pressed=true]{background:var(--leaf);border-color:var(--leaf);color:var(--bg)}
.res{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;color:var(--ink);font-weight:700;align-items:center}
.res small{display:block;color:var(--mut);font-weight:400}
.soonb{font-size:11px;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--mut);padding:2px 8px;border-radius:999px;white-space:nowrap}
.addr{position:fixed;inset:0;background:var(--bg);z-index:25;overflow:auto;padding-bottom:40px}
.sx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.sx .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sx small{color:var(--mut)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.app{--navh:58px;--navgap:10px}
.app.shrunk{--navh:44px;--navgap:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navgap) + env(safe-area-inset-bottom,0px));width:calc(100% - 24px);max-width:536px;z-index:6;padding:6px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.2);transition:width .25s,bottom .25s}
@supports (backdrop-filter:blur(8px)){.nav{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(16px)}}
.app.shrunk .nav{width:calc(100% - 72px)}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.nb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;background:none;color:var(--ink);font-size:10.5px;font-weight:700;height:var(--navh);border-radius:999px;padding:0 2px;transition:height .25s,background .2s}
.nb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:width .25s,height .25s,transform .1s}
.nb svg.on{fill:currentColor;fill-opacity:.3;stroke-width:2.4}
.nb[aria-current=page]{color:var(--leaf);background:var(--bg);background:color-mix(in srgb,var(--leaf) 16%,transparent)}
.nb:active svg{transform:scale(.86)}
.nb span{max-height:14px;overflow:hidden;white-space:nowrap;transition:max-height .2s,opacity .2s}
.app.shrunk .nb span{max-height:0;opacity:0}
.app.shrunk .nb svg{width:22px;height:22px}
.nb .bd{position:absolute;top:3px;left:calc(50% + 4px);min-width:17px;height:17px;border-radius:9px;background:var(--cta);color:var(--oncta);font-size:10px;font-style:normal;display:grid;place-items:center;padding:0 4px}
.bar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:536px;bottom:calc(var(--navh) + var(--navgap) + 22px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:10px 14px;z-index:5;transition:bottom .25s}
.hdr2{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pgs{display:grid;gap:6px;margin-bottom:10px}
.pk2{display:flex;flex-direction:row;align-items:flex-start;gap:10px;margin:0;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:400}
.pk2 input{width:20px;height:20px;padding:0;margin-top:2px;accent-color:var(--leaf);flex:none}
.pk2 span{display:grid}
.pk2 b{font-size:14px}
.pk2 small{color:var(--mut);font-size:12.5px}
.srch{position:relative;margin:4px 0 12px}
.srch input{width:100%;padding:12px 40px 12px 16px;border-radius:999px;font-size:16px}
.srch .x2{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:18px;line-height:1}
.rb[disabled]{opacity:.35;cursor:default}
.trk{display:flex;gap:4px;margin:8px 0 2px}
.trk i{flex:1;height:5px;border-radius:5px;background:var(--line)}
.trk i.on{background:var(--leaf)}
.trkl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-bottom:6px}
.bxs{display:grid;gap:8px;margin:6px 0 12px}
.bx{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px}
.bx span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{background:var(--line);border-radius:6px;height:10px;overflow:hidden}
.bf{background:var(--leaf);height:100%;border-radius:6px}
.cp{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.rail{position:sticky;top:8px;width:74px;flex:none;display:grid;gap:6px;max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:none}
.rb{border:0;background:var(--card);color:var(--mut);border-radius:14px;padding:9px 2px;font-size:11.5px;font-weight:700;line-height:1.15;display:grid;justify-items:center;gap:4px;border-left:4px solid transparent}
.rb[aria-current=true]{background:var(--bg);color:var(--leaf);border:1px solid var(--line);border-left:4px solid var(--leaf)}
.re{position:relative;font-size:26px;line-height:1}
.re i{position:absolute;top:-6px;right:-12px;background:var(--cta);color:var(--oncta);font:700 10px/1 "DM Sans",sans-serif;border-radius:999px;padding:3px 5px;font-style:normal}
.cl{flex:1;min-width:0}
.cs{padding-bottom:14px;scroll-margin-top:12px}
.cs .sec{margin:0 0 10px;font-size:19px}
.cs .sec small{font:600 12px "DM Sans",sans-serif;color:var(--mut);margin-left:4px}
.cl .row{padding:8px;gap:8px}
.cl .em{width:40px;height:40px;font-size:24px}
.cl .add{padding:5px 12px;font-size:14px}
.cl .nm b{font-size:15px;line-height:1.25}
.cl .nm span{font-size:12.5px;line-height:1.4}
.cl .off{font-size:11px;padding:1px 6px}
.cl .step button{width:30px;height:32px}
.tiles{display:flex;gap:10px;overflow-x:auto;margin:16px -16px;padding:0 16px 4px;scroll-snap-type:x proximity;scroll-padding:0 16px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:112px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;font-weight:700;color:var(--ink)}
.tile span{display:block;font-size:32px}
.tile small{display:block;color:var(--mut);font-weight:400}
.sec{font-size:20px;margin:22px 0 10px}
.empty{text-align:center;color:var(--mut);padding:36px 10px;display:grid;gap:12px;justify-items:center}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px}
.oc .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.oc p{margin:0;color:var(--mut);font-size:14px}
.dcode{margin:8px 0;padding:10px 12px;border:2px dashed var(--leaf);border-radius:12px;text-align:center}
.dcode span{display:block;font-size:12px;color:var(--mut);font-weight:700}
.dcode b{display:block;font-size:30px;letter-spacing:8px;color:var(--leaf)}
.dcode small{color:var(--mut);font-size:12px}
.otp input{letter-spacing:6px;font-size:20px;text-align:center}
select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
.chip{font-size:12px;font-weight:700;background:var(--bg);color:var(--leaf);padding:3px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.ghost{background:none;border:2px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 20px;font-weight:700}
.emw{position:relative;flex:none}
.cam{position:absolute;right:-8px;bottom:-8px;min-width:34px;height:28px;border:2px solid var(--card);background:var(--cta);color:var(--oncta);border-radius:999px;font-size:13px;line-height:1;padding:0 6px;display:flex;gap:3px;align-items:center;justify-content:center;font-weight:700}
.pv{position:fixed;inset:0;background:rgba(8,12,10,.96);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.pvx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:2}
.pvdeck{position:relative;width:min(86vw,400px);aspect-ratio:3/4;max-height:62vh}
.pvc{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:#1d2620;box-shadow:0 12px 34px rgba(0,0,0,.5);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .24s}
.pvc.drag{transition:none;cursor:grabbing}
.pvc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.pvcap{position:absolute;left:0;right:0;bottom:0;padding:54px 18px 16px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;flex-direction:column;font-weight:700}
.pvcap b{font-size:20px;font-family:"Bricolage Grotesque",sans-serif}
.pvcap span{font-size:15px}
.pvcap s{opacity:.7;margin-right:6px}
.pvdots{display:flex;gap:6px;margin:16px 0 4px}
.pvdots i{width:7px;height:7px;border-radius:50%;background:#58675e}
.pvdots i.on{background:#fff}
.pvhint{color:#c9d4cd;font-size:14px;margin:0 0 6px}
.pvempty{color:#fff;font-size:18px}
.pvbar{display:flex;align-items:center;gap:18px;margin-top:10px}
.pvbar .rb{width:56px;height:56px}
.pvbar .add{background:var(--card)}
.pm{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pth{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg)}
.pth img{width:100%;height:100%;object-fit:cover}
.pth button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px}
.up{position:relative;display:flex;justify-content:center;border:2px dashed var(--leaf);border-radius:10px;padding:10px;color:var(--leaf);font-weight:700;cursor:pointer;margin:0}
.up input{position:absolute;opacity:0;width:1px;height:1px}
.up:focus-within{outline:3px solid var(--cta);outline-offset:2px}
.nm s{color:var(--mut);margin-right:6px}
.nm strong{color:var(--ink)}
.off{font-style:normal;background:var(--cta);color:var(--oncta);font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:6px;white-space:nowrap}
.ci{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.ci .l1{display:grid;grid-template-columns:54px 1fr 42px;gap:8px;align-items:center}
.ci .l2{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.ci input,.ci select{width:100%;min-width:0;padding:8px 6px;font-size:15px}
.ci small{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}
.ci .dl{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--cta);font-size:18px}
.addbox{border:2px dashed var(--leaf)}
.pch,.pc .t{display:grid;grid-template-columns:1fr 64px 64px 64px;gap:6px;align-items:center}
.pch{font-size:12px;color:var(--mut);padding:0 10px;margin-bottom:6px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pc input{padding:7px 6px;width:100%;min-width:0;font-size:15px}
.pc .r{font-size:13px;margin-top:4px}
.mid{color:#c98a0b}
.pg{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:5px}
.pg i{display:block;height:100%;background:var(--leaf);transition:width .25s}
.lg{padding-top:7vh}
.lgc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:20px}
.ph{display:flex;gap:8px}
.ph span{display:grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700}
.ph input{flex:1;min-width:0;font-size:18px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:400;margin:14px 0}
.chk input{width:22px;height:22px;margin:1px 0 0;padding:0;flex:none;accent-color:var(--leaf)}
.otp{letter-spacing:.45em;text-align:center;font-size:26px;font-weight:700}
.lk{background:none;border:0;color:var(--leaf);font-weight:700;padding:0;text-decoration:underline}
.demo{background:var(--bg);border:1px dashed var(--cta);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 12px}
.terms h3{font-size:16px;margin:14px 0 4px}
.terms p{margin:0;color:var(--mut);font-size:15px}
/* Phones zoom into any box whose text is under 16px, so every field is at least 16px */
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{font-size:16px!important}
.otp input{font-size:20px!important}
.ph input{font-size:18px!important}
/* Delivery status colours: Placed blue, Packed amber, Out for delivery purple, Delivered green */

      <svg class=${tab === k ? "on" : ""} viewBox="0 0 24 24" aria-hidden="true"><path d=${ICONS[k]} /></svg><span>${l}</span>${k === "cart" && count > 0 && h`<i class="bd">${count}</i>`}
    </button>`)}
  </div></nav>`;
}

function App({ mobile, onLogout, isAdmin, profile, onProfile, link, join }) {
  const ITEMS = shopItems(); // only items from categories the admin has switched on
  const OK = "wfb_orders_" + mobile;
  const soc = SOCIETIES.find(x => x.id === profile.soc) || null;
  const linkSoc = link && link.status === "active" ? link : null;
  const effSoc = (soc && soc.status === "active" ? soc : null) || linkSoc;
  const addrOk = !!(soc && soc.status === "active" && profile.name && profile.flat && (!(soc.buildings || []).length || profile.bld));
  const [groups, setGroupsS] = useState(loadGroups);
  const setGroups = fn => setGroupsS(prev => { const n = typeof fn === "function" ? fn(prev) : fn; lsSet(GRK, n); return n; });
  const [joinCode, setJoinCode] = useState(join || "");
  const [gSel, setGSel] = useState(null);
  const [closeAfter, setCloseAfter] = useState(false);
  const openGroups = CFG.groupOn ? groups.filter(g => g.open && g.members.some(m => m.m === mobile) && soc && g.soc === soc.id) : [];
  const gSelId = gSel === null ? (openGroups.length === 1 ? openGroups[0].id : "") : gSel;
  const grp = openGroups.find(g => g.id === gSelId) || null;
  const minOrder = Math.min((effSoc && +effSoc.min) || CFG.min, grp ? CFG.groupMin : Infinity);
  const dayText = (effSoc && effSoc.day) || CFG.delivery;
  const addr = soc ? [profile.flat, profile.bld, soc.name].filter(Boolean).join(", ") : "";
  const [editAddr, setEditAddr] = useState(false);
  const [cart, setCart] = useState({});
  const [tab, setTab] = useState(join && CFG.groupOn ? "groups" : "home");
  const [cat, setCat] = useState(() => { const k = CATS.findIndex((c, i) => !OFF_CATS.has(i)); return k < 0 ? 0 : k; });
  const [q, setQ] = useState("");
  const qn = q.trim().toLowerCase();
  const match = i => !qn || i.n.toLowerCase().includes(qn);
  const GK = "wfb_geo_" + mobile;
  const [geo, setGeo] = useState(() => lsGet(GK, {}));
  const [geoAsk, setGeoAsk] = useState(false);
  const [geoMsg, setGeoMsg] = useState("");
  const doCapture = () => captureLocation((st, v) => {
    if (st === "ok") { const g = { consent: "yes", t: Date.now(), lat: v.lat, lng: v.lng, pin: v.pin }; lsSet(GK, g); setGeo(g); setGeoMsg(""); }
    else setGeoMsg(st === "denied" ? "Your browser blocked location access. Allow it in the browser's site settings and try again." : st === "unsupported" ? "This device does not support location." : "Could not get your location. Please try again.");
  });
  const setConsent = yes => {
    const g = { ...geo, consent: yes ? "yes" : "no", t: Date.now() };
    if (!yes) {
      lsSet(EVK, lsGet(EVK, []).filter(e => !(e.type === "location" && e.m === mobile)));
      delete g.lat; delete g.lng; delete g.pin; setGeoMsg("Location sharing is off. We deleted the location points we held for you.");
    }
    lsSet(GK, g); setGeo(g); setGeoAsk(false);
    track(yes ? "location_on" : "location_off");
    if (yes) doCapture();
  };
  React.useEffect(() => {
    try {
      if (geo.consent === "yes" && !sessionStorage.getItem("wfb_geo_" + mobile)) { sessionStorage.setItem("wfb_geo_" + mobile, "1"); doCapture(); }
    } catch (e) {}
    if (!geo.consent) { const t = setTimeout(() => setGeoAsk(true), 1500); return () => clearTimeout(t); }
  }, []);
  React.useEffect(() => {
    try {
      if (!sessionStorage.getItem("wfb_vis_" + mobile)) {
        sessionStorage.setItem("wfb_vis_" + mobile, "1");
        track("visit", { entry: link ? link.id : "direct", w: window.innerWidth });
      }
    } catch (e) {}
  }, []);
  React.useEffect(() => { track("view", { page: tab }); }, [tab]);
  React.useEffect(() => {
    if (qn.length < 2) return;
    const t = setTimeout(() => track("search", { q: qn, results: ITEMS.filter(match).length, page: tab }), 900);
    return () => clearTimeout(t);
  }, [qn]);
  const searchBox = h`<div class="srch"><input type="search" aria-label="Search items" placeholder="Search vegetables, dal, dry fruits" value=${q} onInput=${e => setQ(e.target.value)} />${q && h`<button class="x2" aria-label="Clear search" onClick=${() => setQ("")}>×</button>`}</div>`;
  const spyLock = React.useRef(0);
  const jumpCat = i => {
    setCat(i); spyLock.current = Date.now() + 700;
    const el = document.getElementById("cs-" + i);
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 12, behavior: "smooth" });
  };
  const [viewer, setViewer] = useState(null);
  const [terms, setTerms] = useState(false);
  const [notice, setNotice] = useState("");
  const [shrunk, setShrunk] = useState(false);
  React.useEffect(() => {
    if (tab !== "cat") return;
    const el = document.getElementById("cs-" + cat);
    if (el && cat > 0) { spyLock.current = Date.now() + 500; window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 12); }
    const f = () => {
      if (Date.now() < spyLock.current) return;
      let cur = 0;
      CATS.forEach((c, i) => { const e = document.getElementById("cs-" + i); if (e && e.getBoundingClientRect().top <= 90) cur = i; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = CATS.length - 1;
      setCat(cur);
    };
    window.addEventListener("scroll", f, { passive: true });
    return () => window.removeEventListener("scroll", f);
  }, [tab]);
  const [confirmReset, setConfirmReset] = useState(false);
  const [orders, setOrders] = useState(() => lsGet(OK, []));
  const [f, setF] = useState({ phone: mobile || "", note: "" });
  const pm = usePhotos();
  const photosFor = i => (pm[i.id] && pm[i.id].length ? pm[i.id] : i.photos || []);
  const go = k => { setTab(k); setShrunk(false); try { window.scrollTo(0, 0); } catch (e) {} };
  React.useEffect(() => {
    let last = window.scrollY || 0, busy = false;
    const on = () => {
      if (busy) return;
      busy = true;
      requestAnimationFrame(() => {
        const y = window.scrollY || 0, d = y - last;
        if (y < 40) { setShrunk(false); last = y; }
        else if (d > 6) { setShrunk(true); last = y; }
        else if (d < -6) { setShrunk(false); last = y; }
        busy = false;
      });
    };
    window.addEventListener("scroll", on, { passive: true });
    return () => window.removeEventListener("scroll", on);
  }, []);
  const resetCart = () => {
    if (!confirmReset) { setConfirmReset(true); setTimeout(() => setConfirmReset(false), 3000); return; }
    setCart({}); setConfirmReset(false);
  };

  const change = (id, d) => {
    if (d > 0) { const it = ITEMS.find(x => x.id === id); track("add", { item: it ? it.n : id }); }
    setCart(c => {
      const q = Math.max(0, (c[id] || 0) + d), n = { ...c };
      if (q === 0) delete n[id]; else n[id] = q;
      return n;
    });
  };
  const addBox = () => setCart(c => {
    const n = { ...c };
    boxLines().forEach(x => { n[x.it.id] = (n[x.it.id] || 0) + x.q; });
    return n;
  });
  const lines = ITEMS.filter(i => cart[i.id]).map(i => ({ ...i, q: cart[i.id] }));
  const sub = lines.reduce((s, l) => s + l.q * l.p, 0);
  const kg = lines.reduce((s, l) => s + l.q * (l.w || 1), 0);
  const kgR = Math.round(kg * 10) / 10;
  const save = lines.reduce((s, l) => s + (l.mrp > l.p ? l.q * (l.mrp - l.p) : 0), 0);
  const gx = grp ? groupStats(grp) : null, gN = gx ? gx.n + 1 : 0, gSub = gx ? gx.sub + sub : 0;
  const fee = sub === 0 ? 0 : grp ? (sub >= CFG.freeAbove || gSub >= CFG.freeAbove ? 0 : Math.ceil(CFG.fee / gN)) : sub >= CFG.freeAbove ? 0 : CFG.fee;
  const gs = gstCalc(lines, fee, cfgGst());
  const total = sub + fee + gs.add;
  const ready = sub >= minOrder && addrOk;
  const set = k => e => setF({ ...f, [k]: e.target.value });
  const setName = e => onProfile({ ...profile, name: e.target.value });
  const rowFor = (i, q) => h`<${Row} key=${i.id} i=${i} q=${q} change=${change} np=${photosFor(i).length} onPhotos=${v => { track("photos", { item: v.n }); setViewer(v); }} />`;
  const deals = ITEMS.filter(i => i.mrp > i.p).sort((a, b) => (b.mrp - b.p) / b.mrp - (a.mrp - a.p) / a.mrp).slice(0, 6);

  const send = () => {
    const oid = Date.now();
    const msg = ["New order: " + CFG.brand + " " + orderNo(oid), "Name: " + profile.name, "Society: " + (soc ? soc.name : ""), "Address: " + [profile.flat, profile.bld].filter(Boolean).join(", "), ...[profile.det ? "Details: " + profile.det : "", soc && soc.drop ? "Drop point: " + soc.drop : "", f.phone ? "Phone: " + f.phone : ""].filter(Boolean), "",
      ...lines.map(l => "• " + l.n + ": " + l.q + " × " + l.u + " = ₹" + l.q * l.p),
      "", "Total weight: " + kgR + " kg", "Items: ₹" + sub, save > 0 ? "Saved vs local prices: ₹" + save : "", (grp ? "Group: " + grp.name : ""), "Delivery: ₹" + fee, gs.on && gs.tax > 0 ? (gs.incl ? "Includes GST: ₹" : "GST: ₹") + money(gs.tax) : "", "Total: ₹" + total, "Delivery: " + dayText,
      f.note ? "Note: " + f.note : ""].filter((x, i, a) => x !== "" || a[i - 1] !== "").join("\n");
    window.open("https://wa.me/" + CFG.wa + "?text=" + encodeURIComponent(msg), "_blank");
    const o = { id: oid, t: oid, status: "placed", name: profile.name, soc: soc ? soc.name : "", bld: profile.bld || "", unit: profile.flat || "", det: profile.det || "", phone: f.phone || mobile, day: dayText, flat: addr, lines: lines.map(l => ({ id: l.id, n: l.n, q: l.q, u: l.u, p: l.p, mrp: l.mrp, ...(+l.g > 0 ? { g: +l.g } : {}), ...(l.hsn ? { hsn: l.hsn } : {}) })), ...(gs.on ? { gst: { incl: gs.incl, tax: gs.tax, groups: gs.groups, gstin: CFG.gstin, fr: CFG.gstFee } } : {}), sub, fee, total, kg: kgR, save, otp: newOtp(), assignedTo: pickEmployee(soc ? soc.name : ""), ...(grp ? { grp: grp.id, grpName: grp.name } : {}) };
    const next = [o, ...orders].slice(0, 30);
    lsSet(OK, next);
    if (grp) { regroupFees(grp.id); if (closeAfter && grp.owner === mobile) { setGroups(gs => gs.map(x => x.id === grp.id ? { ...x, open: false, closedAt: Date.now() } : x)); audit("group_closed", { group: grp.id, name: grp.name, by: mobile, how: "with order" }); } setGSel(null); setCloseAfter(false); }
    setOrders(lsGet(OK, next));
    track("order", { total, items: lines.length, society: soc ? soc.name : "" });
    audit("placed", { ...orderTag(o), ...(grp ? { group: grp.id } : {}), by: "customer" });
    if (o.assignedTo) audit("assigned", { ...orderTag(o), emp: o.assignedTo, by: "auto" });
    setCart({}); setF({ ...f, note: "" });
    setNotice("Your order " + orderNo(oid) + " was sent on WhatsApp. We will confirm it there.");
    go("orders");
  };
  const reorder = o => {
    setCart(c => { const n = { ...c }; o.lines.forEach(l => { if (ITEMS.some(i => i.id === l.id)) n[l.id] = (n[l.id] || 0) + l.q; }); return n; });
    setNotice(""); go("cart");
  };
  const clearOrders = () => { setOrders([]); lsSet(OK, []); };

  const bar = (tab === "home" || tab === "cat") && lines.length > 0 && h`<div class="bar"><div class="in" style=${{ maxWidth: 560, margin: "0 auto", display: "flex", alignItems: "center", gap: 12 }}>
    <div style=${{ flex: 1 }}><b>₹${sub}</b><div class="note" style=${{ margin: 0 }}>${lines.length} item${lines.length > 1 ? "s" : ""} · ${sub < minOrder ? "₹" + (minOrder - sub) + " more to order" : kgR + " kg"}</div><div class="pg"><i style=${{ width: Math.min(100, sub / minOrder * 100) + "%" }}></i></div></div>
    <button class="cta" onClick=${() => go("cart")}>View cart</button>
  </div></div>`;

  return h`<div class=${"app" + (shrunk ? " shrunk" : "")}>
    <div class="wrap">
      ${tab === "home" && h`<div>
        <header><h1>${CFG.brand}</h1>${CFG.tagline && h`<p class="sub tag">${CFG.tagline}</p>`}<p class="sub">${profile.name ? "Hi " + profile.name.split(" ")[0] + ". " : ""}Fresh from the market to ${effSoc ? effSoc.name : "your society"}</p></header>
        ${!qn && h`<${Carousel} items=${CFG.banners} auto=${true} />`}
        <div class="banner"><span>🕘</span><span>Orders placed by <b>${CFG.close}</b>. Delivery <b>${dayText}</b>. Minimum order <b>₹${minOrder}</b>.</span></div>
        ${CFG.groupOn && h`<button class="grpcard" onClick=${() => go("groups")}><span aria-hidden="true">👥</span><span><b>${openGroups.length ? "Your group: " + openGroups[0].name : "Order together with neighbours"}</b><small>${openGroups.length ? groupStats(openGroups[0]).n + " order(s) so far · ₹" + groupStats(openGroups[0]).sub + " of ₹" + CFG.freeAbove + " for free delivery" : "Start a group, share the link, and split the delivery fee. Free for all from ₹" + CFG.freeAbove + "."}</small></span><i aria-hidden="true">›</i></button>`}
        <p class="note">Prices shown are sample prices.</p>
        ${searchBox}
        ${qn && h`<div><h2 class="sec">${ITEMS.filter(match).length} result${ITEMS.filter(match).length === 1 ? "" : "s"}</h2>${ITEMS.filter(match).length === 0 ? h`<p class="note">No items match “${q}”. Try another word.</p>` : h`<ul>${ITEMS.filter(match).map(i => rowFor(i, cart[i.id] || 0))}</ul>`}</div>`}
        ${!qn && boxLines().length > 0 && h`<div class="box">
          <div><h2>${BOX.name}</h2><p>${boxLines().map(x => x.it.n).join(", ")} · ₹${boxPrice()}</p></div>
          <button onClick=${addBox}>Add box</button>
        </div>`}
        ${!qn && h`<div class="tiles">${CATS.map((c, i) => OFF_CATS.has(i) ? null : h`<button key=${c} class="tile" onClick=${() => { setCat(i); go("cat"); }}><span>${CAT_E[i] || "🛒"}</span>${c}<small>${ITEMS.filter(x => +x.c === i).length} items</small></button>`)}</div>`}
        ${!qn && deals.length > 0 && h`<div><h2 class="sec">Today’s best deals</h2><ul>${deals.map(i => rowFor(i, cart[i.id] || 0))}</ul></div>`}
      </div>`}

      ${tab === "cat" && h`<div>
        <div style=${{ paddingTop: 12 }}>${searchBox}</div>
        <div class="cp">
        <nav class="rail" aria-label="Categories">
          ${CATS.map((c, i) => { if (OFF_CATS.has(i)) return null; const n = lines.filter(l => +((ITEMS.find(x => x.id === l.id) || {}).c) === i).length; const has = ITEMS.some(x => +x.c === i && match(x)); return h`<button key=${c} class="rb" disabled=${!has} aria-current=${cat === i ? "true" : "false"} onClick=${() => jumpCat(i)}><span class="re">${CAT_E[i] || "🛒"}${n > 0 && h`<i>${n}</i>`}</span>${c}</button>`; })}
        </nav>
        <div class="cl">
          ${qn && ITEMS.filter(match).length === 0 && h`<p class="note">No items match “${q}”. Try another word.</p>`}
          ${CATS.map((c, i) => {
            const its = ITEMS.filter(x => +x.c === i && match(x));
            if (!its.length) return null;
            const lastVis = Math.max(...CATS.map((cc, k) => ITEMS.some(x => +x.c === k && match(x)) ? k : -1));
            return h`<section key=${c} id=${"cs-" + i} class="cs" style=${i === lastVis && !qn ? { minHeight: "calc(100vh - 230px)" } : null}>

              <ul>${its.map(x => rowFor(x, cart[x.id] || 0))}</ul>
            </section>`;
          })}
        </div>
        </div>
      </div>`}

      ${tab === "cart" && h`<div>
        <header class="hdr2"><h1>Your cart</h1>${lines.length > 0 && h`<button class="lk" onClick=${resetCart}>${confirmReset ? "Tap again to clear" : "Reset cart"}</button>`}</header>
        ${lines.length === 0 ? h`<div class="empty"><div style=${{ fontSize: 48 }} aria-hidden="true">🛒</div><p>Your cart is empty.</p><button class="cta" onClick=${() => go("home")}>Start shopping</button></div>` : h`<div>
          <ul>${lines.map(l => rowFor(l, l.q))}</ul>
          ${(sub < minOrder || (fee > 0 && !grp)) && h`<div class=${"nudge" + (sub < minOrder ? " need" : "")} role="status">
            <div class="nt"><span class="ni" aria-hidden="true">${sub < minOrder ? "🛒" : "🚚"}</span><span>${sub < minOrder ? h`Add <b>₹${minOrder - sub}</b> more to reach the <b>₹${minOrder}</b> minimum order` : h`Add <b>₹${CFG.freeAbove - sub}</b> more for <b>free delivery</b>`}</span></div>
            <div class="np" aria-hidden="true"><i style=${{ width: Math.min(100, Math.round(sub / (sub < minOrder ? minOrder : CFG.freeAbove) * 100)) + "%" }}></i></div>
          </div>`}
          ${sub >= minOrder && fee === 0 && h`<div class="nudge ok" role="status"><div class="nt"><span class="ni" aria-hidden="true">🎉</span><span><b>Free delivery</b> on this order</span></div></div>`}
          ${CFG.groupOn && addrOk && openGroups.length > 0 && h`<div class="oc grpbox">
            <label>Order with<select value=${gSelId} onChange=${e => setGSel(e.target.value)}><option value="">Just me</option>${openGroups.map(g => h`<option key=${g.id} value=${g.id}>👥 ${g.name}</option>`)}</select></label>

              <div class="np" aria-hidden="true"><i style=${{ width: Math.min(100, Math.round(gSub / CFG.freeAbove * 100)) + "%" }}></i></div>
              ${grp.owner === mobile && h`<label class="pk2" style=${{ margin: "8px 0 0" }}><input type="checkbox" checked=${closeAfter} onChange=${e => setCloseAfter(e.target.checked)} /><span><b>Close the group after my order</b><small>Nobody else can order with this group afterwards.</small></span></label>`}
            </div>`}

            <div class="oc" style=${{ marginBottom: 12 }}><div class="top"><div><b>Deliver to</b><p>${addr}</p>${profile.det && h`<p>${profile.det}</p>`}${soc && soc.drop && h`<p>Drop point: ${soc.drop}</p>`}</div><button class="lk" onClick=${() => setEditAddr(true)}>Change</button></div></div>

      ${tab === "orders" && h`<div>

        ${notice && h`<div class="banner"><span>✅</span><span>${notice}</span></div>`}
        ${orders.length === 0 ? h`<div class="empty"><div style=${{ fontSize: 48 }} aria-hidden="true">🧾</div><p>No orders yet.</p><button class="cta" onClick=${() => go("home")}>Start shopping</button></div>` : h`<ul>
          ${orders.map(o => h`<li key=${o.id} class=${"oc st-" + STAGES[stageIdx(o.status)][0]}>
            <div class="top"><b>${fmtDate(o.t)}</b><span class="chip sch">${STAGES[stageIdx(o.status)][1]}</span></div>
            <p class="ono">Order ${orderNo(o)}${o.grpName ? " · 👥 " + o.grpName : ""}</p>
            <div class="trk" aria-hidden="true">${STAGES.map((st, k) => h`<i key=${st[0]} class=${k <= stageIdx(o.status) ? "on" : ""}></i>`)}</div>

            ${o.status === "delivered" && o.deliveredBy && o.deliveredBy !== "admin" && h`<p>Delivered by ${(findEmp(o.deliveredBy) || {}).name || "our delivery partner"}${o.deliveredAt ? " · " + fmtDate(o.deliveredAt) : ""}</p>`}

          ${geo.consent === "yes" && geo.t && geo.lat != null && h`<p class="note" style=${{ margin: "8px 0 0" }}>Last shared ${fmtDate(geo.t)}${geo.pin ? " · pin code " + geo.pin : ""}.</p>`}

        <p style=${{ marginTop: 16 }}><button class="lk" onClick=${() => setTerms(true)}>Terms and Conditions</button>${isAdmin && h` · <a class="lk" href="#admin">Admin</a>`}${orders.length > 0 && h` · <button class="lk" onClick=${clearOrders}>Clear order history</button>`}</p>
        <button class="ghost" style=${{ width: "100%", marginTop: 8 }} onClick=${onLogout}>Log out</button>

    ${editAddr && h`<${AddressSetup} mobile=${mobile} profile=${profile} link=${linkSoc} onCancel=${() => setEditAddr(false)} onSave=${p => { onProfile(p); setEditAddr(false); }} />`}
    ${viewer && h`<${PhotoViewer} key=${viewer.id} item=${ITEMS.find(x => x.id === viewer.id) || viewer} photos=${photosFor(viewer)} q=${cart[viewer.id] || 0} change=${change} onClose=${() => setViewer(null)} />`}
    ${terms && h`<${Terms} onClose=${() => setTerms(false)} />`}
    ${geoAsk && !terms && h`<div class="ov"><div class="sheet" role="dialog" aria-modal="true" aria-label="Share your location">
      <div class="sh"><h2>Share your location?</h2></div>
      <p>We would like your phone's GPS location (latitude, longitude) and the pin code of that spot. It helps us see where our customers are and which societies to serve next.</p>

      <button class="ghost" style=${{ width: "100%", marginTop: 8 }} onClick=${() => setConsent(false)}>Not now</button>

    <${NavBar} tab=${tab} go=${go} count=${lines.length} />

}

// ---- Login with mobile number and OTP ----
const SK = "wfb_session";
function loadSession() {
  try { const o = JSON.parse(localStorage.getItem(SK) || "null"); if (o && o.mobile && Date.now() - o.t < 30 * 864e5) return o.mobile; } catch (e) {}
  return "";
}
function saveSession(m) { try { localStorage.setItem(SK, JSON.stringify({ mobile: m, t: Date.now() })); } catch (e) {} }
function clearSession() { try { localStorage.removeItem(SK); } catch (e) {} }

const demoState = { code: "", exp: 0 };
async function sendOtp(mobile) {
  if (CFG.demoOtp) {
    demoState.code = String(Math.floor(100000 + Math.random() * 900000));
    demoState.exp = Date.now() + 5 * 60 * 1000;
    return { ok: true, demo: demoState.code };
  }
  const r = await fetch(CFG.api + "/send-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mobile }) });
  return { ok: r.ok };
}
async function verifyOtp(mobile, otp) {
  if (CFG.demoOtp) return { ok: Date.now() < demoState.exp && otp === demoState.code };
  const r = await fetch(CFG.api + "/verify-otp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mobile, otp }) });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok && j.ok === true };
}

function Login({ onDone }) {
  const [step, setStep] = useState(0);
  const [mobile, setMobile] = useState("");
  const [agree, setAgree] = useState(false);
  const [terms, setTerms] = useState(false);
  const [otp, setOtp] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [wait, setWait] = useState(0);
  const [demo, setDemo] = useState("");
  const [tries, setTries] = useState(0);
  const valid = /^[6-9]\d{9}$/.test(mobile);

  React.useEffect(() => {
    if (wait <= 0) return;
    const t = setTimeout(() => setWait(wait - 1), 1000);
    return () => clearTimeout(t);
  }, [wait]);

  const send = async () => {
    setBusy(true); setErr("");
    try {
      const r = await sendOtp(mobile);
      if (!r.ok) throw new Error("send");
      setDemo(r.demo || ""); setStep(1); setOtp(""); setTries(0); setWait(30);
    } catch (e) { setErr("Could not send the OTP. Please try again."); }
    setBusy(false);
  };
  const verify = async () => {
    if (tries >= 5) { setErr("Too many wrong attempts. Please request a new OTP."); return; }
    setBusy(true); setErr("");
    try {
      const r = await verifyOtp(mobile, otp);
      if (r.ok) { saveSession(mobile); onDone(mobile); return; }
      track("login_failed", { m: mobile }); setTries(tries + 1); setErr("That OTP is not correct.");
    } catch (e) { setErr("Could not verify. Please try again."); }
    setBusy(false);
  };

  return h`<div class="wrap lg">
    <div style=${{ fontSize: 44 }} aria-hidden="true">🥬</div>
    <h1>${CFG.brand}</h1>
    ${CFG.tagline && h`<p class="sub tag">${CFG.tagline}</p>`}
    <p class="sub">Log in with your mobile number to place your weekly order.</p>
    <div class="lgc">
      ${step === 0 ? h`<div>
        <label>Mobile number
          <div class="ph"><span>+91</span><input value=${mobile} inputmode="numeric" autocomplete="tel-national" placeholder="10-digit number" onInput=${e => setMobile(e.target.value.replace(/\D/g, "").slice(0, 10))} /></div>
        </label>
        ${mobile.length > 0 && !valid && h`<p class="warn">Enter a valid 10-digit Indian mobile number.</p>`}
        <label class="chk"><input type="checkbox" checked=${agree} onChange=${e => setAgree(e.target.checked)} />
          <span>I agree to the <button class="lk" onClick=${e => { e.preventDefault(); setTerms(true); }}>Terms and Conditions</button></span></label>
        ${err && h`<p class="warn">${err}</p>`}
        <button class="cta" style=${{ width: "100%" }} disabled=${!valid || !agree || busy} onClick=${send}>${busy ? "Sending…" : "Send OTP"}</button>
      </div>` : h`<div>
        <p style=${{ margin: "0 0 12px" }}>Enter the 6-digit OTP sent to <b>+91 ${mobile}</b>. <button class="lk" onClick=${() => { setStep(0); setErr(""); }}>Change</button></p>
        ${demo && h`<p class="demo">Demo mode: no SMS is sent. Your OTP is <b>${demo}</b></p>`}
        <label>OTP<input class="otp" value=${otp} inputmode="numeric" autocomplete="one-time-code" maxlength="6" onInput=${e => setOtp(e.target.value.replace(/\D/g, "").slice(0, 6))} /></label>
        ${err && h`<p class="warn">${err}</p>`}
        <button class="cta" style=${{ width: "100%" }} disabled=${otp.length !== 6 || busy} onClick=${verify}>${busy ? "Checking…" : "Verify and continue"}</button>
        <p class="note" style=${{ textAlign: "center", marginTop: 12 }}>${wait > 0 ? "Resend OTP in " + wait + "s" : h`<button class="lk" onClick=${send}>Resend OTP</button>`}</p>
      </div>`}
    </div>
    ${terms && h`<${Terms} onClose=${() => setTerms(false)} />`}
  </div>`;
}

function AddressSetup({ mobile, profile, link, inline, onSave, onCancel, onLogout }) {
  const first = (profile.soc && SOCIETIES.find(s => s.id === profile.soc && s.status === "active")) || (link && link.status === "active" ? link : null);
  const [soc, setSoc] = useState(first || null);
  const [q, setQ] = useState("");
  const [area, setArea] = useState("");
  const [bld, setBld] = useState(first && first.id === profile.soc ? profile.bld || "" : "");
  const [flat, setFlat] = useState(profile.flat || "");
  const [det, setDet] = useState(profile.det || "");
  const [name, setName] = useState(profile.name || "");
  const [ask, setAsk] = useState(link && link.status !== "active" ? link : null);
  const [sent, setSent] = useState(false);
  const [lim, setLim] = useState(8);
  const cur = profile.soc ? SOCIETIES.find(s => s.id === profile.soc) : null;
  const areas = [...new Set(SOCIETIES.map(s => s.area))].sort();
  const lc = t => (t || "").toLowerCase();
  const term = lc(q.trim());
  const hits = SOCIETIES.filter(s => (!area || s.area === area) && (!term || [s.name, s.area, s.pincode].concat(s.alias || []).some(x => lc(x).includes(term))))
    .sort((a, b) => (a.status === "active" ? 0 : 1) - (b.status === "active" ? 0 : 1) || a.name.localeCompare(b.name));
  const live = hits.filter(s => s.status === "active"), soon = hits.filter(s => s.status !== "active");
  const shownLive = live.slice(0, lim), shownSoon = soon.slice(0, Math.max(0, lim - live.length));
  const more = hits.length - shownLive.length - shownSoon.length;
  const resBtn = s => h`<li key=${s.id}><button class=${"res" + (s.status !== "active" ? " dim" : "")} aria-current=${cur && cur.id === s.id ? "true" : null} onClick=${() => pick(s)}><span>${s.name}<small>${s.area}${s.pincode ? " · " + s.pincode : ""}</small></span>${cur && cur.id === s.id ? h`<span class="curb">✓ Your address</span>` : s.status !== "active" ? h`<span class="soonb">Notify me</span>` : null}</button></li>`;
  const pick = s => { if (s.status === "active") { setSoc(s); setBld(""); } else { setAsk(s); setSent(false); } };
  const canSave = soc && name.trim() && flat.trim() && (!(soc.buildings || []).length || bld);
  const notify = () => {
    const msg = "Please tell me when " + CFG.brand + " starts delivering at " + ask.name + (ask.pincode ? " (" + ask.pincode + ")" : "") + ".\nMy number: +91 " + mobile;
    try { const L = JSON.parse(localStorage.getItem("wfb_notify") || "[]"); L.push({ nn: ask.name, np: ask.pincode, t: Date.now() }); localStorage.setItem("wfb_notify", JSON.stringify(L)); } catch (e) {}
    window.open("https://wa.me/" + CFG.wa + "?text=" + encodeURIComponent(msg), "_blank");
    setSent(true);
  };
  const body = h`<div class=${inline ? "" : "wrap"} style=${inline ? null : { paddingTop: 20 }}>
    ${inline ? h`<b style=${{ fontSize: 18 }}>Where should we deliver?</b>` : h`<h1>Where should we deliver?</h1>`}
    <p class="sub" style=${{ marginBottom: 12 }}>We deliver only to selected societies for now.</p>
    ${ask ? h`<div class="lgc" style=${{ marginTop: 0 }}>
      <b>We are not delivering to ${ask.name} yet.</b>
      <p class="note">Tap below and we will message you on WhatsApp as soon as delivery starts there.</p>
      ${sent && h`<p class="note good">Thanks. Your message is ready in WhatsApp. Send it and we will note your request.</p>`}
      <button class="cta" style=${{ width: "100%" }} onClick=${notify}>Notify me on WhatsApp</button>
      <p style=${{ marginBottom: 0 }}><button class="lk" onClick=${() => { setAsk(null); setSent(false); }}>Back to the list</button></p>
    </div>` : !soc ? h`<div>
      <label>Search your society<input value=${q} placeholder="Type the society name, area or pincode" onInput=${e => { setQ(e.target.value); setLim(8); }} autoFocus=${!inline} /></label>
      ${areas.length > 3 ? h`<label>Area<select value=${area} onChange=${e => { setArea(e.target.value); setLim(8); }}><option value="">All areas</option>${areas.map(a => h`<option key=${a} value=${a}>${a}</option>`)}</select></label>`
        : areas.length > 1 && h`<div class="chips nw" role="group" aria-label="Area">
        <button class="chp" aria-pressed=${area === ""} onClick=${() => { setArea(""); setLim(8); }}>All areas</button>
        ${areas.map(a => h`<button key=${a} class="chp" aria-pressed=${area === a} onClick=${() => { setArea(area === a ? "" : a); setLim(8); }}>${a}</button>`)}
      </div>`}
      ${cur && !term && !area && h`<div class="oc cura"><div class="top"><div><b>${cur.name}</b><p>${[profile.bld, profile.flat].filter(Boolean).join(", ")}${profile.flat || profile.bld ? " · " : ""}${cur.area}</p></div><span class="curb">✓ Your address</span></div></div>`}
      <p class="note" style=${{ margin: "4px 0 8px" }}>${hits.length} societ${hits.length === 1 ? "y" : "ies"}${term || area ? " found" : ""}</p>
      ${live.length > 0 && h`<h3 class="gh">Delivering now (${live.length})</h3><ul>${shownLive.map(resBtn)}</ul>`}
      ${soon.length > 0 && shownSoon.length > 0 && h`<h3 class="gh">Coming soon (${soon.length})</h3><p class="note" style=${{ margin: "0 0 6px" }}>Tap one and we will message you when delivery starts there.</p><ul>${shownSoon.map(resBtn)}</ul>`}
      ${more > 0 && h`<button class="ghost" style=${{ width: "100%", marginTop: 8 }} onClick=${() => setLim(lim + 8)}>Show ${Math.min(8, more)} more (${more} left)</button>`}
      ${hits.length === 0 && h`<p class="note">No society found. We add new societies regularly.</p>`}
    </div>` : h`<div>
      <div class="oc"><div class="top"><div><b>${soc.name}</b><p>${soc.area}</p></div><button class="lk" onClick=${() => { setSoc(null); setBld(""); }}>Change</button></div></div>
      ${(soc.buildings || []).length > 0 && h`<div style=${{ marginTop: 14 }}><b>Building</b>
        ${soc.buildings.length <= 12
          ? h`<div class="chips" role="group" aria-label="Building">${soc.buildings.map(b => h`<button key=${b} class="chp" aria-pressed=${bld === b} onClick=${() => setBld(b)}>${b}</button>`)}</div>`
          : h`<select value=${bld} onChange=${e => setBld(e.target.value)} aria-label="Building" style=${{ width: "100%", padding: 11, margin: "8px 0 14px" }}><option value="">Select building</option>${soc.buildings.map(b => h`<option key=${b} value=${b}>${b}</option>`)}</select>`}
      </div>`}
      <label style=${{ marginTop: 14 }}>Flat or floor number<input value=${flat} placeholder="e.g. 1204" onInput=${e => setFlat(e.target.value)} /></label>
      <label>More address details (optional)<textarea rows="2" value=${det} placeholder="Wing, landmark, delivery instructions" onInput=${e => setDet(e.target.value)}></textarea></label>
      <label>Your name<input value=${name} autocomplete="name" onInput=${e => setName(e.target.value)} /></label>
      <div class="banner" style=${{ margin: "4px 0 12px" }}><span>🚚</span><span>Orders placed by <b>${CFG.close}</b>. Delivery <b>${soc.day || CFG.delivery}</b>. Minimum order <b>₹${+soc.min || CFG.min}</b>.${soc.drop ? " Drop point: " + soc.drop + "." : ""}</span></div>
      <button class="cta" style=${{ width: "100%" }} disabled=${!canSave} onClick=${() => onSave({ ...profile, name: name.trim(), soc: soc.id, bld, flat: flat.trim(), det: det.trim() })}>${inline ? "Save address" : "Save and continue"}</button>
    </div>`}
    ${onCancel && h`<p><button class="lk" onClick=${onCancel}>Cancel</button></p>`}
    ${onLogout && h`<p class="note">Logged in as +91 ${mobile} · <button class="lk" onClick=${onLogout}>Log out</button></p>`}
  </div>`;
  return onCancel ? h`<div class="addr">${body}</div>` : body;
}

// ---- Delivery team (testing: stored in this browser; a backend will replace this later) ----
const EMPK = "wfb_employees";
const loadEmps = () => lsGet(EMPK, []);
const findEmp = m => loadEmps().find(e => e.mobile === m) || null;
function newOtp() {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return String(1000 + (a[0] % 9000)); }
  catch (e) { return String(1000 + Math.floor(Math.random() * 9000)); }
}
function eachOrderKey(fn) {
  const keys = [];
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith("wfb_orders_")) keys.push(k); } } catch (e) {}
  keys.forEach(fn);
}
// Change one order wherever it is stored
function patchOrder(id, fn) {
  eachOrderKey(k => {
    const list = lsGet(k, []);
    if (list.some(o => o.id === id)) lsSet(k, list.map(o => o.id === id ? fn(o) : o));
  });
}
function allRawOrders() {
  const out = [];
  eachOrderKey(k => lsGet(k, []).forEach(o => out.push({ ...o, _m: k.slice(11) })));
  return out;
}
// Audit trail: append-only list of what happened and who did it (kept in this browser for testing)
const AUK = "wfb_audit";
function audit(type, d) {
  const l = lsGet(AUK, []); l.push({ t: Date.now(), type, ...d });
  lsSet(AUK, l.slice(-8000));
}
const orderTag = o => ({ order: o.id, where: [o.soc, o.bld, o.unit].filter(Boolean).join(", ") || o.flat || "", total: o.total, cust: o.name || "" });
// ---- Groups (kept in this browser until the online version) ----
const GRK = "wfb_groups";
const loadGroups = () => { const l = lsGet(GRK, []); return Array.isArray(l) ? l.filter(g => g && g.id && Array.isArray(g.members)) : []; };
const newCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for (let i = 0; i < 6; i++) c += A[Math.floor(Math.random() * A.length)]; return c; };
const groupLink = g => location.href.split("#")[0] + "#g-" + g.code;
function groupStats(g) {
  const os = allRawOrders().filter(o => o.grp === g.id);
  return { orders: os, n: os.length, sub: os.reduce((t, o) => t + (o.sub || 0), 0), by: new Set(os.map(o => o._m)) };
}
// Delivery is shared: every order still being prepared pays an equal share, or nothing once the group (or the order itself) reaches the free-delivery amount
function regroupFees(gid) {
  const all = allRawOrders().filter(o => o.grp === gid), n = all.length, gsub = all.reduce((t, o) => t + (o.sub || 0), 0);
  all.filter(o => !o.status || o.status === "placed" || o.status === "packed").forEach(o => {
    const nf = (o.sub >= CFG.freeAbove || gsub >= CFG.freeAbove) ? 0 : Math.ceil(CFG.fee / n);
    if (nf === o.fee) return;
    const c = o.gst ? gstCalc(o.lines, nf, { on: true, incl: o.gst.incl, fr: o.gst.fr }) : null;
    patchOrder(o.id, x => ({ ...x, fee: nf, ...(c ? { gst: { ...x.gst, tax: c.tax, groups: c.groups } } : {}), total: x.sub + nf + (c ? c.add : 0) }));
    audit("fee_shared", { order: o.id, group: gid, fee: nf, by: "auto" });
  });
}
// Short order number shown everywhere (derived from the order id so it is the same on every screen)
const orderNo = o => "#" + Number(o && o.id != null ? o.id : o).toString(36).toUpperCase().slice(-6);
const STAGES = [["placed", "Placed"], ["packed", "Packed"], ["out", "Out for delivery"], ["delivered", "Delivered"]];
const stageIdx = st => Math.max(0, STAGES.findIndex(x => x[0] === (st || "placed")));
function setStage(o, st, by) {
  patchOrder(o.id, x => ({ ...x, status: st }));
  audit("status", { ...orderTag(o), status: st, emp: o.assignedTo || "", by });
}
const isOpen = o => (o.status || "placed") !== "delivered";
// Auto assignment: employees who cover the society come first; the one with the fewest open orders gets the next order.
function pickEmployee(socName) {
  const act = loadEmps().filter(e => e.active);
  if (!act.length) return "";
  const nm = String(socName || "").toLowerCase();
  const cover = act.filter(e => nm && (e.socs || []).some(x => { x = String(x).toLowerCase().trim(); return x && (nm.includes(x) || x.includes(nm)); }));
  const pool = cover.length ? cover : act;
  const load = {};
  allRawOrders().filter(isOpen).forEach(o => { if (o.assignedTo) load[o.assignedTo] = (load[o.assignedTo] || 0) + 1; });
  return pool.slice().sort((a, b) => (load[a.mobile] || 0) - (load[b.mobile] || 0))[0].mobile;
}
// Give every open order without a (still active) employee to someone
function assignOpenOrders() {
  const act = new Set(loadEmps().filter(e => e.active).map(e => e.mobile));
  allRawOrders().filter(o => isOpen(o) && !act.has(o.assignedTo)).forEach(o => {
    const e = pickEmployee(o.soc);
    if (e) { patchOrder(o.id, x => ({ ...x, assignedTo: e })); audit("assigned", { ...orderTag(o), emp: e, from: o.assignedTo || "", by: "auto" }); }
  });
}
// Old orders placed before delivery codes existed get one
// Savings on a past order: saved at order time, or worked out from the catalogue's local price for older orders
function orderSave(o) {
  if (o.save != null) return +o.save || 0;
  return (o.lines || []).reduce((t, l) => { const m = l.mrp != null ? +l.mrp : +((ITEMS.find(i => i.id === l.id) || {}).mrp || 0); return t + (m > l.p ? l.q * (m - l.p) : 0); }, 0);
}
function migrateOrders() {
  allRawOrders().filter(o => isOpen(o) && !o.otp).forEach(o => patchOrder(o.id, x => ({ ...x, otp: newOtp() })));
}
// Returns "" on success or an error message
function completeDelivery(id, code, empMobile) {
  const o = allRawOrders().find(x => x.id === id);
  if (!o) return "Order not found.";
  if (!isOpen(o)) return "This order is already delivered.";
  if (o.lockUntil && o.lockUntil > Date.now()) return "Too many wrong codes. Try again in a few minutes.";
  if (o.assignedTo && o.assignedTo !== empMobile) audit("taken_over", { ...orderTag(o), emp: empMobile, from: o.assignedTo, by: empMobile });
  if (String(code).trim() !== String(o.otp)) {
    const tries = (o.tries || 0) + 1;
    patchOrder(id, x => ({ ...x, tries: tries >= CFG.maxTries ? 0 : tries, lockUntil: tries >= CFG.maxTries ? Date.now() + 5 * 60 * 1000 : 0 }));
    audit(tries >= CFG.maxTries ? "locked" : "wrong_code", { ...orderTag(o), emp: empMobile, by: empMobile });
    const left = CFG.maxTries - tries;
    return left <= 0 ? "Too many wrong codes. Try again in a few minutes." : "That code is not correct. Ask the customer again. " + left + (left === 1 ? " try left." : " tries left.");
  }
  const me = (lsGet(EMPK, []) || []).find(e => e.mobile === empMobile);
  const payRate = me && me.rate != null ? Math.max(0, +me.rate || 0) : CFG.pay; // rate locked in at delivery time
  patchOrder(id, x => ({ ...x, status: "delivered", deliveredAt: Date.now(), deliveredBy: empMobile, payRate, tries: 0, lockUntil: 0 }));
  audit("delivered", { ...orderTag(o), emp: empMobile, by: empMobile, codeOk: true, customer: o.phone || o._m });
  return "";
}

function Deliveries({ emp, onLogout }) {
  const [tab, setTab] = useState("pending");
  const [ver, setVer] = useState(0);
  const [open, setOpen] = useState(null);
  const [code, setCode] = useState("");
  const [err, setErr] = useState("");
  React.useEffect(() => {
    const f = () => setVer(v => v + 1);
    window.addEventListener("storage", f);
    const t = setInterval(f, 8000);
    return () => { window.removeEventListener("storage", f); clearInterval(t); };
  }, []);
  void ver;
  const cur = findEmp(emp.mobile);
  if (!cur || !cur.active) return h`<div class="wrap lg"><h1>Account deactivated</h1><p class="sub">Please contact the admin.</p><button class="ghost" onClick=${onLogout}>Log out</button></div>`;
  const all = allRawOrders();
  const mine = all.filter(o => isOpen(o) && o.assignedTo === emp.mobile).sort((a, b) => (a.soc || "").localeCompare(b.soc || "") || (a.unit || "").localeCompare(b.unit || ""));
  const free = all.filter(o => isOpen(o) && !o.assignedTo);
  const done = all.filter(o => !isOpen(o) && o.deliveredBy === emp.mobile).sort((a, b) => (b.deliveredAt || 0) - (a.deliveredAt || 0));
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const doneToday = done.filter(o => (o.deliveredAt || 0) >= dayStart.getTime());
  const myRate = cur.rate == null ? CFG.pay : +cur.rate || 0;
  const amtOf = o => o.paidAt ? (o.paidAmt != null ? +o.paidAmt : 0) : (o.payRate != null ? +o.payRate : myRate);
  const sum = l => l.reduce((t, o) => t + amtOf(o), 0);
  const weekStart = new Date(dayStart); weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));
  const doneWeek = done.filter(o => (o.deliveredAt || 0) >= weekStart.getTime());
  const unpaidL = done.filter(o => !o.paidAt), paidL = done.filter(o => o.paidAt);
  const take = o => { patchOrder(o.id, x => ({ ...x, assignedTo: emp.mobile })); audit("assigned", { ...orderTag(o), emp: emp.mobile, by: emp.mobile, claimed: true }); setVer(v => v + 1); };
  const submit = o => {
    if (!/^\d{4}$/.test(code)) { setErr("Enter the 4-digit code."); return; }
    const e = completeDelivery(o.id, code, emp.mobile);
    setErr(e);
    if (!e) { setOpen(null); setCode(""); setVer(v => v + 1); }
  };
  const addr = o => [o.soc, o.bld, o.unit].filter(Boolean).join(", ") || o.flat || "Address not given";
  const card = (o, isFree) => h`<li key=${o.id} class=${"oc st-" + STAGES[stageIdx(o.status)][0]}>
    <div class="top"><b>${addr(o)}</b><span class="chip">₹${o.total}</span></div>
    <p class="ono">Order ${orderNo(o)}${o.grpName ? " · 👥 " + o.grpName : ""}</p>
    <p style=${{ margin: "0 0 6px" }}><span class="chip sch">${STAGES[stageIdx(o.status)][1]}</span></p>
    <p>${o.name || "Customer"}${o.det ? " · " + o.det : ""}</p>
    ${o.phone && h`<p><a class="lk" href=${"tel:" + o.phone}>Call ${o.phone}</a></p>`}
    <p>${(o.lines || []).map(l => l.n + " × " + l.q + " " + l.u).join(", ")}</p>
    ${isFree ? h`<button class="ghost" onClick=${() => take(o)}>Take this order</button>` : open === o.id ? h`<div class="otp">
      <label>Code from the customer<input class=${err ? "bad" : ""} inputMode="numeric" maxLength="4" placeholder="4-digit code" value=${code} onInput=${e => { setCode(e.target.value.replace(/\D/g, "").slice(0, 4)); setErr(""); }} /></label>
      ${err && h`<p class="err" role="alert">${err}</p>`}
      <div style=${{ display: "flex", gap: 10 }}><button class="cta" onClick=${() => submit(o)}>Confirm delivery</button><button class="ghost" onClick=${() => { setOpen(null); setCode(""); setErr(""); }}>Cancel</button></div>
    </div>` : h`<div style=${{ display: "flex", gap: 10, flexWrap: "wrap" }}>
      ${o.status !== "out" && h`<button class="ghost" onClick=${() => { setStage(o, "out", emp.mobile); setVer(v => v + 1); }}>Start delivery</button>`}
      <button class="cta" onClick=${() => { setOpen(o.id); setCode(""); setErr(""); }}>Complete delivery</button></div>`}
  </li>`;
  return h`<div class="wrap">
    <header><h1>My deliveries</h1><p class="sub">${cur.name} · +91 ${cur.mobile}</p></header>
    <div class="sm">
      <div><b>${mine.length}</b><span>to deliver</span></div>
      <div><b>${doneToday.length}</b><span>delivered today</span></div>
      <div><b>₹${sum(doneToday)}</b><span>earned today</span></div>
    </div>
    <div class="tabs" role="group" aria-label="Deliveries">
      <button class="tab" aria-pressed=${tab === "pending"} onClick=${() => setTab("pending")}>Pending (${mine.length})</button>
      <button class="tab" aria-pressed=${tab === "done"} onClick=${() => setTab("done")}>Delivered (${done.length})</button>
    </div>
    ${tab === "done" && h`<div class="sm">
      <div><b>₹${sum(doneWeek)}</b><span>this week</span></div>
      <div><b>₹${sum(unpaidL)}</b><span>to be paid</span></div>
      <div><b>₹${sum(paidL)}</b><span>paid so far</span></div>
    </div>
    <p class="note">Your pay is ₹${myRate} per delivery from now on. Earlier deliveries keep the rate they had. Payment status is saved on the device where the admin marks it paid.</p>`}
    ${tab === "pending" ? h`<div>
      ${mine.length === 0 && h`<p class="note">No pending deliveries assigned to you.</p>`}
      <ul>${mine.map(o => card(o, false))}</ul>
      ${free.length > 0 && h`<h2>Not assigned to anyone (${free.length})</h2><ul>${free.map(o => card(o, true))}</ul>`}
    </div>` : h`<div>
      ${done.length === 0 && h`<p class="note">You have not delivered any orders yet.</p>`}
      <ul>${done.map(o => h`<li key=${o.id} class="oc st-delivered">
        <div class="top"><b>${addr(o)}</b><span class="chip sch">Delivered</span></div>
        <p class="ono">Order ${orderNo(o)}${o.grpName ? " · 👥 " + o.grpName : ""}</p>
        <p>${o.name || "Customer"} · ₹${o.total}</p>
        <p>${(o.lines || []).map(l => l.n + " × " + l.q + " " + l.u).join(", ")}</p>
        <p><span class=${"chip " + (o.paidAt ? "st-ok" : "st-bad")}>${o.paidAt ? "Paid" : "Unpaid"}</span> ₹${amtOf(o)}${o.paidAt ? " · paid on " + fmtDate(o.paidAt) : " · due"}</p>
        <p class="note" style=${{ margin: 0 }}>${o.deliveredAt ? fmtDate(o.deliveredAt) : ""}</p>
      </li>`)}</ul>
    </div>`}
    <div style=${{ display: "flex", gap: 10, margin: "14px 0" }}><button class="ghost" onClick=${() => setVer(v => v + 1)}>Refresh</button><button class="ghost" onClick=${onLogout}>Log out</button></div>
  </div>`;
}

// Pages an employee can be given. "del" is the delivery list; the others reuse the admin screens.

const pagesOf = e => { const p = (e && e.pages || []).filter(k => PAGES.some(x => x[0] === k)); return p.length ? p : ["del"]; };
function PageChecks({ val, onChange }) {

function EmployeeApp({ emp, onLogout }) {

function Groups({ mobile, profile, soc, addrOk, groups, setGroups, join, clearJoin, onAddress, onShop, onBack }) {
  const [name, setName] = useState("");
  const [open, setOpen] = useState(null);
  const [msg, setMsg] = useState("");
  const mine = groups.filter(g => g.members.some(m => m.m === mobile)).sort((a, b) => (b.open - a.open) || b.t - a.t);
  const jg = join ? groups.find(g => g.code === join) : null;
  const already = jg && jg.members.some(m => m.m === mobile);
  const upd = (id, fn) => setGroups(gs => gs.map(g => g.id === id ? fn(g) : g));
  const create = () => {
    if (!addrOk || !name.trim()) return;
    const g = { id: "g" + Date.now().toString(36), code: newCode(), name: name.trim().slice(0, 40), soc: soc.id, socName: soc.name, owner: mobile, ownerName: profile.name || "", members: [{ m: mobile, name: profile.name || "", t: Date.now() }], open: true, t: Date.now() };
    setGroups(gs => [g, ...gs]); audit("group_created", { group: g.id, name: g.name, where: soc.name, by: mobile });
    setName(""); setOpen(g.id); setMsg("Group created. Share the link with your neighbours.");
  };
  const doJoin = () => {
    if (!jg) return;
    if (!addrOk) { onAddress(); return; }
    if (!jg.open) { setMsg("This group is closed."); return; }
    if (soc.id !== jg.soc) { setMsg("This group delivers to " + jg.socName + ". Your address is in " + soc.name + "."); return; }
    if (jg.members.length >= 30) { setMsg("This group is full."); return; }
    upd(jg.id, g => ({ ...g, members: [...g.members, { m: mobile, name: profile.name || "", t: Date.now() }] }));
    audit("group_joined", { group: jg.id, name: jg.name, by: mobile });
    setOpen(jg.id); clearJoin(); setMsg("You joined " + jg.name + ".");
  };
  const share = g => { const t = "Join my group \"" + g.name + "\" on " + CFG.brand + " and share the delivery fee. " + groupLink(g); window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank"); };
  const copy = g => { try { navigator.clipboard.writeText(groupLink(g)).then(() => setMsg("Link copied.")); } catch (e) { setMsg(groupLink(g)); } };
  const card = g => {
    const st = groupStats(g), isOwner = g.owner === mobile, isOpen = open === g.id;
    return h`<li key=${g.id} class="oc">
      <div class="top"><button class="lk" style=${{ textAlign: "left", fontWeight: 700 }} aria-expanded=${isOpen} onClick=${() => setOpen(isOpen ? null : g.id)}>👥 ${g.name}</button><span class=${"chip " + (g.open ? "st-ok" : "sch")}>${g.open ? "Open" : "Closed"}</span></div>
      <p class="note" style=${{ margin: "4px 0" }}>${g.socName} · ${g.members.length} member${g.members.length > 1 ? "s" : ""} · ${st.n} order${st.n === 1 ? "" : "s"} · group total ₹${st.sub}</p>
      <div class="np" aria-hidden="true"><i style=${{ width: Math.min(100, Math.round(st.sub / CFG.freeAbove * 100)) + "%" }}></i></div>
      <p class="note" style=${{ margin: "4px 0" }}>${st.sub >= CFG.freeAbove ? "Free delivery reached for everyone." : "₹" + (CFG.freeAbove - st.sub) + " more for free delivery. Until then the delivery fee is shared."}</p>
      ${isOpen && h`<div>
        <ul class="bl">${g.members.map(m => h`<li key=${m.m}><span>${m.name || "Neighbour"}${m.m === g.owner ? " (started the group)" : ""}${m.m === mobile ? " · you" : ""}</span><b>${st.by.has(m.m) ? "Ordered ✓" : "Not yet"}</b></li>`)}</ul>
        <div style=${{ display: "flex", gap: 8, flexWrap: "wrap", margin: "8px 0" }}>
          ${g.open && h`<button class="cta" onClick=${() => onShop(g.id)}>Shop for this group</button>`}
          ${g.open && h`<button class="ghost" onClick=${() => share(g)}>Share on WhatsApp</button>`}
          ${g.open && h`<button class="ghost" onClick=${() => copy(g)}>Copy link</button>`}
        </div>
        ${isOwner && g.open && h`<button class="lk" onClick=${() => { upd(g.id, x => ({ ...x, open: false, closedAt: Date.now() })); audit("group_closed", { group: g.id, name: g.name, by: mobile, how: "manual" }); }}>Close this group</button>`}
        ${isOwner && !g.open && (st.n === 0 ? h`<button class="lk" onClick=${() => { upd(g.id, x => ({ ...x, open: true, closedAt: null })); audit("group_reopened", { group: g.id, name: g.name, by: mobile }); }}>Open this group again</button>` : h`<p class="note">Orders were already placed, so this group stays closed. Start a new group for your next order.</p>`)}
        ${!isOwner && !st.by.has(mobile) && h`<button class="lk" onClick=${() => { upd(g.id, x => ({ ...x, members: x.members.filter(m => m.m !== mobile) })); setOpen(null); }}>Leave group</button>`}
      </div>`}
    </li>`;
  };
  return h`<div>
    <header class="hdr2"><h1>Groups</h1><button class="lk" onClick=${onBack}>← Home</button></header>
    <p class="sub">Order with your neighbours. Everyone places their own order and bill, and the delivery fee is shared.</p>
    ${msg && h`<div class="banner" role="status"><span>ℹ️</span><span>${msg}</span></div>`}
    ${join && !already && (jg ? h`<div class="oc grpbox">
      <b>You are invited to ${jg.name}</b>
      <p class="note">Started by ${jg.ownerName || "a neighbour"} · ${jg.socName} · ${jg.members.length} member${jg.members.length > 1 ? "s" : ""} · ${jg.open ? "Open" : "Closed"}</p>
      ${jg.open ? h`<button class="cta" onClick=${doJoin}>${addrOk ? "Join group" : "Choose my delivery address to join"}</button>` : h`<p class="warn">This group is closed.</p>`}
    </div>` : h`<div class="oc"><p class="warn">We could not find this group. Groups are saved on the phone that created them for now, so ask for a new link once the online version is live.</p></div>`)}
    <div class="oc">
      <b>Start a group</b>
      ${addrOk ? h`<div><label>Group name<input maxLength="40" placeholder="Tower B, 4th floor" value=${name} onInput=${e => setName(e.target.value)} /></label>
        <p class="note" style=${{ margin: "0 0 8px" }}>Delivers to ${soc.name}. Your delivery address is used for your own order.</p>
        <button class="cta" disabled=${!name.trim()} onClick=${create}>Create group</button></div>` : h`<div><p class="note">Choose your delivery address first, the same as when you review your cart.</p><button class="cta" onClick=${onAddress}>Choose delivery address</button></div>`}
    </div>
    ${mine.length > 0 ? h`<h2 style=${{ margin: "14px 0 6px" }}>Your groups</h2><ul>${mine.map(card)}</ul>` : h`<p class="note" style=${{ marginTop: 12 }}>You are not in any group yet.</p>`}
    <p class="note" style=${{ marginTop: 14 }}>Groups are saved on this device for now. Sharing between different phones comes with the online version.</p>
  </div>`;
}

function Gate({ link, join }) {
  const [m, setM] = useState(loadSession());
  const [prof, setProf] = useState(() => lsGet("wfb_profile_" + loadSession(), {}));
  const logout = () => { track("logout"); clearSession(); setM(""); };
  if (!m) return h`<${Login} onDone=${mm => { setM(mm); setProf(lsGet("wfb_profile_" + mm, {})); track("login", { m: mm, soc: (lsGet("wfb_profile_" + mm, {})).soc || "" }); }} />`;
  const save = p => { if (p.soc !== prof.soc || p.bld !== prof.bld) track("address", { society: p.soc, building: p.bld || "", soc: p.soc || "" }); lsSet("wfb_profile_" + m, p); setProf(p); };
  const emp = findEmp(m);
  if (emp && !ADMIN_MOBILES.includes(m)) return emp.active ? h`<${EmployeeApp} emp=${emp} onLogout=${logout} />` : h`<div class="wrap lg">
    <h1>Account deactivated</h1>
    <p class="sub">+91 ${m} is no longer active on the delivery team. Please contact the admin.</p>
    <button class="ghost" onClick=${logout}>Log out</button>
  </div>`;
  return h`<${App} mobile=${m} isAdmin=${ADMIN_MOBILES.includes(m)} profile=${prof} onProfile=${save} onLogout=${logout} link=${link} join=${join} />`;
}

// ---- Buying list (open this page with #admin at the end of the link) ----
const kgOf = (n, u, q) => {
  if (/^kg$/i.test(u)) return q;
  const it = ITEMS.find(x => x.n === n);
  return it && it.w ? q * it.w : null;
};
const fk = x => (Math.round(x * 10) / 10) + " kg";
function parse(text) {
  const seen = new Set();
  let dups = 0;
  const out = text.split(/New order:/i).slice(1).map(b => {
    const key = b.replace(/\s+/g, " ").trim().toLowerCase();
    if (seen.has(key)) { dups++; return null; }
    seen.add(key);
    const g = k => { const m = b.match(new RegExp("^" + k + ":\\s*(.*)$", "mi")); return m ? m[1].trim() : ""; };
    const num = re => { const m = b.match(re); return m ? +m[1] : null; };
    const items = [];
    b.split("\n").forEach(l => {
      const m = l.match(/^[•\-*]\s*(.+?):\s*(\d+)\s*[×x]\s*(.+?)\s*=\s*₹\s*(\d+)/);
      if (m) items.push({ n: m[1].trim(), q: +m[2], u: m[3].trim(), amt: +m[4] });
    });
    const sub = items.reduce((s, i) => s + i.amt, 0);
    const fee = num(/^Delivery:\s*₹\s*(\d+)/mi) || 0;
    const tot = num(/^Total:\s*₹\s*(\d+)/mi);
    const kgMsg = num(/^Total weight:\s*([\d.]+)\s*kg/mi);
    return { name: g("Name"), soc: g("Society"), flat: g("Address") || g("Flat"), det: g("Details"), phone: g("Phone"), items, sub, fee, total: tot !== null ? tot : sub + fee, kg: kgMsg !== null ? kgMsg : items.reduce((s, i) => s + (kgOf(i.n, i.u, i.q) || 0), 0) };
  }).filter(o => o && o.items.length);
  out.dups = dups;
  return out;
}
const idx = n => { const i = ITEMS.findIndex(x => x.n === n); return i < 0 ? 999 : i; };
function summarize(list) {
  const m = {};
  list.forEach(o => o.items.forEach(i => {
    const k = i.n + "|" + i.u, a = m[k] || (m[k] = { n: i.n, u: i.u, q: 0, amt: 0, kg: 0, known: true });
    a.q += i.q; a.amt += i.amt;
    const kk = kgOf(i.n, i.u, i.q);
    if (kk === null) a.known = false; else a.kg += kk;
  }));
  const sum = f => list.reduce((s, o) => s + o[f], 0);
  return { rows: Object.values(m).sort((a, b) => idx(a.n) - idx(b.n)), n: list.length, kg: sum("kg"), sub: sum("sub"), fee: sum("fee"), total: sum("total") };
}
const qtyText = a => a.q + " " + a.u + (!/^kg$/i.test(a.u) && a.known ? " (~" + fk(a.kg) + ")" : "");
function SumRows({ s }) {
  return h`<div>
    ${s.rows.map(a => h`<div key=${a.n + "|" + a.u} class="sr"><span>${(ITEMS.find(x => x.n === a.n) || {}).e || "•"} ${a.n}</span><span><b>${a.q} ${a.u}</b>${!/^kg$/i.test(a.u) && a.known && h` <small>(~${fk(a.kg)})</small>`}</span><span>₹${a.amt}</span></div>`)}
    <div class="sr tot"><span>Total</span><span>${fk(s.kg)}</span><span>₹${s.sub}</span></div>
  </div>`;
}

// Orders placed on this device are kept in localStorage (testing). A backend will replace this later.
function loadStoredOrders() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith("wfb_orders_")) continue;
      const mobile = k.slice(11);
      lsGet(k, []).forEach(o => {
        const items = (o.lines || []).map(l => ({ n: l.n, q: l.q, u: l.u, amt: l.q * l.p }));
        if (!items.length) return;
        const sub = o.sub != null ? o.sub : items.reduce((s, x) => s + x.amt, 0), fee = o.fee || 0;
        out.push({
          id: o.id, mobile, t: o.t, assignedTo: o.assignedTo || "", deliveredBy: o.deliveredBy || "", status: o.status || "placed", name: o.name || "", soc: o.soc || "",
          flat: [o.unit, o.bld].filter(Boolean).join(", ") || o.flat || "", det: o.det || "", phone: o.phone || mobile,
          items, sub, fee, total: o.total != null ? o.total : sub + fee,
          kg: o.kg != null ? o.kg : items.reduce((s, x) => s + (kgOf(x.n, x.u, x.q) || 0), 0)
        });
      });
    }
  } catch (e) {}
  return out;
}
